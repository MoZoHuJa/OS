# SCARLIX OS v19.6.7 — Media Tools (optional stack)
# v19.6.6 (KPK-19.6.5-P2-04): the build context is REAL now — this compose
#   declared 'build: .' while media-tools/ had no Dockerfile (the independent
#   audit's finding); the Dockerfile + server.py + templates/ ship here.
#   Loopback-published only (127.0.0.1:8200), scarlix-net internal otherwise.
# v19.6.7 (KPK-19.6.6-P2-03): the conversion surface is AUTHENTICATED and
#   BOUNDED. MEDIA_TOOLS_TOKEN is generated by generate-env.sh into
#   /etc/scarlix/.env and interpolated here — WITHOUT it /convert answers
#   503 fail-closed (the surface stays closed until the token exists and the
#   stack is restarted; /health stays open for the healthcheck): loopback
#   publishing alone never stopped OTHER containers on the shared external
#   scarlix-net from reaching port 8200. Concurrency is bounded
#   (MEDIA_TOOLS_MAX_CONCURRENCY, default 2): every accepted conversion may
#   hold an ffmpeg/ImageMagick subprocess for up to 600s — the old unbounded
#   thread-per-request server let one reachable peer saturate the container.
services:
  media-tools:
    build: .
    container_name: media-tools
    restart: unless-stopped
    ports: ["127.0.0.1:8200:8200"]
    environment:
      # v19.6.7 (KPK-19.6.6-P2-03): bearer-token auth, fail-closed — an
      # empty value means CLOSED (503 on /convert and /templates), never
      # OPEN. Wrong/missing token → 401; comparison is constant-time.
      - MEDIA_TOOLS_TOKEN=${MEDIA_TOOLS_TOKEN:-}
      # v19.6.7: bounded concurrency — simultaneous conversions; default 2,
      # validated + clamped 1..16 server-side. Beyond the bound: 15s queue
      # wait, then 503; max 2 in-flight per client IP (429 beyond).
      - MEDIA_TOOLS_MAX_CONCURRENCY=${MEDIA_TOOLS_MAX_CONCURRENCY:-2}
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
      - ./data/templates:/data/templates
    networks: [scarlix-net]
    deploy: {resources: {limits: {memory: 4G, cpus: '2'}}}
networks:
  scarlix-net: {external: true}
