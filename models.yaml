# SCARLIX OS v17.1 — EndeavourOS Edition — Model-Agnostic Configuration
# Edit this file to use ANY HuggingFace model.
# Then run: bash /opt/scarlix/scripts/download-models.sh
#
# v17.1: 5-tier inference architecture
#   Tier-1: SGLang (agents, RadixAttention)
#   Tier-2: vLLM (high throughput, Multi-LoRA) [NEW]
#   Tier-3: Ollama (GGUF, concurrent)
#   Tier-4: BeeLlama.cpp (offline, KVarN KV cache) [NEW — replaces llama.cpp]
#   Tier-5: FreeToken (MoE, experimental --profile moe) [NEW]

# === Tier-1: SGLang (safetensors, GPU 0) ===
sglang:
  model_path: "/models/Qwen3-14B-Instruct-AWQ"
  # Alternatívy:
  # model_path: "/models/Meta-Llama-3.1-8B-Instruct"
  # model_path: "/models/mistralai/Mistral-7B-Instruct-v0.3"
  # model_path: "/models/google/gemma-2-9b-it"
  quantization: "awq"
  context_length: 32768
  mem_fraction: 0.85
  flashinfer: true

# === Tier-2: vLLM (Multi-LoRA, multi-GPU TP=2) [NEW v17.1] ===
vllm:
  model_path: "/models/Qwen3-14B-Instruct-AWQ"
  tensor_parallel_size: 2          # Use both GPUs for >24GB models
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  enable_lora: true                 # Multi-LoRA: Hermes/OpenCode/Voice share base
  max_loras: 4
  lora_adapters:
    hermes: "/models/lora/hermes"
    opencode: "/models/lora/opencode"
    voice: "/models/lora/voice"
  # Alternatívy:
  # model_path: "/models/Meta-Llama-3.1-8B-Instruct"
  # model_path: "/models/Qwen3-72B-Instruct-AWQ"  # Needs TP=2

# === Tier-3: Ollama Main (GGUF, GPU 0) ===
ollama_main:
  model: "qwen3.6:14b"
  keep_alive: "15m"
  num_parallel: 4

# === Tier-3: Ollama Agent (GGUF, GPU 1) ===
ollama_agent:
  model: "qwen3.6:14b"
  keep_alive: "-1"
  num_parallel: 2

# === Tier-4: BeeLlama.cpp (CPU fallback, KVarN KV cache) [NEW v17.1] ===
# Replaces llama.cpp — same GGUF files, but KVarN quantization = ~50% VRAM reduction
# Reasoning-loop protection for unattended agent runs
beellama:
  model_file: "/models/qwen3.6-14b-instruct-q4_k_m.gguf"
  hf_repo: "Qwen/Qwen3-14B-Instruct-GGUF"
  hf_file: "qwen3.6-14b-instruct-q4_k_m.gguf"
  context_size: 32768              # Doubled from 8192 thanks to KVarN
  threads: 16
  cache_type_k: "kvarn4"           # KVarN 4-bit KV cache
  cache_type_v: "kvarn4"
  kv_tail_tokens: 1024             # Full precision for recent tokens
  reasoning_loop_protection: true

# === Tier-5: FreeToken (MoE, experimental) [NEW v17.1] ===
# Activate via: docker compose --profile moe up -d
# Runs DeepSeek-V3/V4, Qwen3-Coder-A35B on 2x16GB GPU + RAM offload
freetoken:
  model_path: "/models/Qwen3-Coder-A35B-FTW"
  gpu_memory_fraction: 0.80
  cpu_offload: true
  semantic_kv_cache: true
  bandwidth_adaptive: true

# === System-1: Laya (33ms router, replaces Needle2) [NEW v17.1] ===
laya:
  model_path: "/models/laya/router-v1"
  device: "cuda:0"
  max_batch: 32
  enable_mcp: true                 # MCP protocol for Hermes integration

# === ComfyUI (creative mode, GPU 0) ===
comfyui:
  checkpoint: "flux1-dev-fp8.safetensors"

# === Whisper (STT, GPU 1) ===
whisper:
  model: "Systran/faster-whisper-large-v3"
  language: "sk"

# === Piper (TTS, CPU) ===
piper:
  voice: "sk_SK-lili-medium"

# === Embeddings ===
embeddings:
  model: "nomic-embed-text"
