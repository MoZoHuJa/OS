# SCARLIX OS v19.1.15 — EndeavourOS Edition — Model-Agnostic Configuration
#
# v17.9.7: flashinfer disabled in SGLang compose (--disable-flashinfer) — Blackwell sm_120 safe.
#   `flashinfer: false` documents this (compose is the source of truth for the flag).
# v17.5: Single source of truth — scarlix-mode parses this and exports env vars
#   to docker compose. Edit model_path to use ANY HuggingFace model.
#
# Verified AI path:
#   Tier-1: SGLang (GPU0, agents, RadixAttention, --disable-flashinfer)
#   Tier-2: vLLM (GPU1, TP=1, Multi-LoRA) — only if /etc/scarlix/.experimental
#   Tier-4: BeeLlama.cpp / llama.cpp (CPU, offline, q4_0 KV cache)
#   Fallback: Ollama (starter model qwen2.5:3b auto-downloaded by install.sh)

# === Tier-1: SGLang (DEFAULT, GPU 0) ===
# Edit model_path to use ANY HuggingFace safetensors model.
# hf_repo: HuggingFace repo ID for download (model_path is LOCAL path)
# Then run: download-models.sh
sglang:
  model_path: "/models/Qwen3-14B-AWQ"
  hf_repo: "Qwen/Qwen3-14B-AWQ"  # v17.9.5: correct repo (was Qwen3-14B-Instruct-AWQ — doesn't exist)
  # Alternatívy (odkomentuj + zmeň hf_repo):
  # model_path: "/models/Meta-Llama-3.1-8B-Instruct"
  # hf_repo: "meta-llama/Llama-3.1-8B-Instruct"
  # model_path: "/models/Mistral-7B-Instruct-v0.3"
  # hf_repo: "mistralai/Mistral-7B-Instruct-v0.3"
  # v18.8.8 P1-03: quantization removed (was: not wired to compose — SGLang
  #   auto-detects from checkpoint config. Having it here gave false impression
  #   it was configurable. To use different quantization: change model_path.)
  # quantization: "awq"  # REMOVED — not a runtime parameter
  context_length: 32768
  mem_fraction: 0.85
  # v18.8.3 P1 (D): Basic SGLang runtime tuning (no PyTorch env vars — kept
  #   conservative for stability). These map to SGLang CLI flags via .env.
  #   chunked_prefill_size: smaller = less peak VRAM for prefill (4096 = safe for 16GB)
  #   max_running_requests: limit concurrent requests (4 = single-user agent load)
  chunked_prefill_size: 4096
  max_running_requests: 4
  # v18.8.7 P1-05: shm_size from models.yaml → .env → compose (was: hardcoded 8gb in compose).
  shm_size: "8gb"
  # v17.9.7: flashinfer DISABLED in SGLang compose (--disable-flashinfer).
  # v18.8.7 P1-05: flashinfer removed as config key — it's NOT wired to compose
  #   (compose hardcodes --disable-flashinfer for Blackwell sm_120 safety in v0.4.4).
  #   Having it in models.yaml gave false impression it was configurable. To enable
  #   flashinfer: upgrade SGLang image + remove --disable-flashinfer from compose.
  # flashinfer: false  # REMOVED — not a runtime parameter in current architecture

# === Tier-2: vLLM (EXPERIMENTAL, GPU 1, TP=1) ===
# Only starts if /etc/scarlix/.experimental flag exists (created by wizard for 2+ GPU).
# v17.5: TP=1 (not TP=2) — safe for mixed GPU architectures (RTX 5060 Ti + RTX 4060 Ti).
vllm:
  model_path: "/models/Qwen3-14B-AWQ"
  tensor_parallel_size: 1  # v17.5: TP=1 (mixed GPU safe — not TP=2)
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  enable_lora: false  # v17.5: LoRA paths removed (didn't exist)
  # v19.1.15 P1: trust_remote_code — controls vLLM --trust-remote-code flag.
  #   true/1/yes → VLLM_TRUST_FLAG="--trust-remote-code" (enables custom model code).
  #   false (default) → flag disabled (only built-in architectures).
  #   SECURITY: only enable with TRUSTED model sources (verified HF repos).
  trust_remote_code: false

# === Tier-4: BeeLlama.cpp / llama.cpp (DEFAULT, CPU offline) ===
# v17.5: Uses official llama.cpp image (not BeeLlama fork — was unverified).
# KVarN flags are BeeLlama-specific; official image uses q4_0 (similar benefit).
beellama:
  # v18.8.8 P1-02: model_file removed (was: dead config — hf_file is used by
  #   download-models.sh, scarlix-mode, and compose. model_file was never read.)
  hf_repo: "Qwen/Qwen3-14B-GGUF"  # v17.9.5: correct repo
  hf_file: "Qwen3-14B-Q4_K_M.gguf"  # v17.9.5: correct file (was qwen3.6-14b... — doesn't exist)
  context_size: 32768
  threads: 16
  cache_type_k: "q4_0"  # v17.5: q4_0 (official llama.cpp), not kvarn4 (BeeLlama fork)
  cache_type_v: "q4_0"

# === Fallback: Ollama (starter model auto-downloaded by install.sh) ===
# install.sh pulls qwen2.5:3b (~2GB) so Ollama fallback works immediately.
# For larger models, run: ollama pull qwen3.6:14b
ollama:
  model: "qwen2.5:3b"  # Starter model (auto-downloaded)
  # For production: model: "qwen3.6:14b"
  keep_alive: "15m"
  num_parallel: 2

# === ComfyUI (creative mode, GPU 0) ===
comfyui:
  checkpoint: "flux1-dev-fp8.safetensors"

# === Whisper (STT, GPU 1) ===
whisper:
  model: "Systran/faster-whisper-large-v3"
  language: "sk"

# === Piper (TTS, CPU) ===
piper:
  voice: "sk_SK-lili-medium"

# === Embeddings ===
embeddings:
  model: "nomic-embed-text"
