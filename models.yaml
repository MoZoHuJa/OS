# SCARLIX OS v17.2 — EndeavourOS Edition — Model-Agnostic Configuration
#
# v17.2: 2-tier default (SGLang + BeeLlama); vLLM/FreeToken/Laya = experimental opt-in
# Edit this file to use ANY HuggingFace model.
# Then run: bash /opt/scarlix/scripts/download-models.sh

# === Tier-1: SGLang (DEFAULT — agents, RadixAttention) ===
sglang:
  model_path: "/models/Qwen3-14B-Instruct-AWQ"
  quantization: "awq"
  context_length: 32768
  mem_fraction: 0.85
  flashinfer: true

# === Tier-3: Ollama (DEFAULT — GGUF concurrent) ===
ollama_main:
  model: "qwen3.6:14b"
  keep_alive: "15m"
  num_parallel: 4

ollama_agent:
  model: "qwen3.6:14b"
  keep_alive: "-1"
  num_parallel: 2

# === Tier-4: BeeLlama.cpp (DEFAULT — offline, KVarN KV cache) ===
# Replaces llama.cpp — ~50% VRAM reduction at near-equal quality
beellama:
  model_file: "/models/qwen3.6-14b-instruct-q4_k_m.gguf"
  hf_repo: "Qwen/Qwen3-14B-Instruct-GGUF"
  hf_file: "qwen3.6-14b-instruct-q4_k_m.gguf"
  context_size: 32768
  threads: 16
  cache_type_k: "kvarn4"
  cache_type_v: "kvarn4"
  kv_tail_tokens: 1024
  reasoning_loop_protection: true

# ============================================================================
# EXPERIMENTAL (opt-in via /etc/scarlix/.experimental flag)
# These only start if user enabled experimental mode in wizard
# ============================================================================

# === Tier-2: vLLM (EXPERIMENTAL — Multi-LoRA, multi-GPU TP=2) ===
# Needs 2+ GPU with 32GB+ VRAM total
vllm:
  model_path: "/models/Qwen3-14B-Instruct-AWQ"
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  enable_lora: true
  max_loras: 4
  lora_adapters:
    hermes: "/models/lora/hermes"
    opencode: "/models/lora/opencode"
    voice: "/models/lora/voice"

# === Tier-5: FreeToken (EXPERIMENTAL — MoE, --profile moe) ===
# For DeepSeek-V3/V4, Qwen3-Coder-A35B on consumer GPUs
freetoken:
  model_path: "/models/Qwen3-Coder-A35B-FTW"
  gpu_memory_fraction: 0.80
  cpu_offload: true
  semantic_kv_cache: true

# === System-1: Laya (EXPERIMENTAL — 33ms router, replaces Needle2) ===
laya:
  model_path: "/models/laya/router-v1"
  device: "cuda:0"
  max_batch: 32
  enable_mcp: true

# === ComfyUI (creative mode, GPU 0) ===
comfyui:
  checkpoint: "flux1-dev-fp8.safetensors"

# === Whisper (STT, GPU 1) ===
whisper:
  model: "Systran/faster-whisper-large-v3"
  language: "sk"

# === Piper (TTS, CPU) ===
piper:
  voice: "sk_SK-lili-medium"

# === Embeddings ===
embeddings:
  model: "nomic-embed-text"
