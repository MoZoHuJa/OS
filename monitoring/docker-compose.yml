services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.108.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports: ["100.64.0.1:8428:8428"]
    volumes: ["./victoria:/storage"]
    command: --storageDataPath=/storage --retentionPeriod=90d
    networks: [scarlix-net]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports: ["100.64.0.1:3001:3000"]
    volumes: ["./grafana:/var/lib/grafana"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://monitoring.scarlix.example.com
    networks: [scarlix-net]

  otel-collector:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
        # v18.8.1 P1: Pinned to stable version (was: :latest. Verified via Docker Hub API.)
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    restart: unless-stopped
    ports: ["100.64.0.1:4317:4317", "100.64.0.1:4318:4318"]
    volumes: ["./otel/config.yaml:/etc/otelcol/config.yaml"]
    networks: [scarlix-net]

  openlit:
    # v18.8.3 P1: was :latest on Docker Hub — Docker Hub has NO official openlit/openlit
    #   repo (pull fails). The official OpenLit image lives on ghcr.io/openlit/openlit.
    # v19.0.1 P1: Pinned to ghcr.io/openlit/openlit:1.5.0 (was openlit/openlit:latest —
    #   non-existent on Docker Hub → container would fail to pull on first start).
    #   Verified via ghcr.io/v2/openlit/openlit/tags/list: 1.5.0 is the latest stable
    #   (others: 0.1.4, 1.0.0-1.4.0). Update deliberately when upgrading.
    image: ghcr.io/openlit/openlit:1.5.0
    container_name: openlit
    restart: unless-stopped
    # v18.8.3 P1: experimental — only starts with --profile tracing (already had this)
    profiles: [tracing]
    ports: ["100.64.0.1:3002:3000"]
    volumes: ["./openlit:/data"]
    networks: [scarlix-net]

  alertmanager:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
        # v18.8.1 P1: Pinned to stable version (was: :latest. Verified via Docker Hub API.)
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    ports: ["100.64.0.1:9093:9093"]
    volumes: ["./alertmanager:/etc/alertmanager"]
    networks: [scarlix-net]
    profiles: [tracing]

networks:
  scarlix-net: {external: true}
