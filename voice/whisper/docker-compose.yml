services:
  whisper-sk:
    image: fedirz/faster-whisper-server:sha-307e23f-cuda
    # v19.0.3 P0-2: was :0.10.0 (tag does NOT exist on Docker Hub — 0.10.x tags = []).
    #   Now: sha-307e23f-cuda (verified exists). Upstream moved to "Speaches" —
    #   consider migrating in a future release.
    container_name: whisper-sk
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./data:/root/.cache
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-large-v3
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=int8_float16
      - WHISPER__LANGUAGE=sk
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
