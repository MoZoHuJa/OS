services:
  openwakeword:
    image: rhasspy/wyoming-openwakeword:1.10.0
    container_name: openwakeword
    restart: unless-stopped
    ports:
      - "127.0.0.1:10400:10400"
    command: |
      --uri 'tcp://0.0.0.0:10400'
      --wake-word hey_jarvis
      --threshold 0.5
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
