services:
  # NOTE: Steam, Wine, Proton, Lutris, RetroArch are NATIVE (pacman/AUR)
  # Sunshine is NATIVE for game mode (systemd service)
  # Sunshine Docker container is for TV mode only
  
  sunshine-tv:
    # v18.7.7 P1: Pinned to versioned tag (was: :latest → supply-chain risk:
    #   git commit + identical install.sh + install today → image A, but next
    #   week → image B without any change in SCARLIX OS). Now pinned to the
    #   latest verified nightly tag for ubuntu-24.04 (Sunshine doesn't publish
    #   stable semver tags — only nightly date-based tags). Update this tag
    #   deliberately when upgrading, don't let it float.
    #   Verified via hub.docker.com/v2/repositories/lizardbyte/sunshine/tags
    image: lizardbyte/sunshine:v2026.929.125923-ubuntu-24.04
    container_name: sunshine-tv
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./sunshine/config:/config
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/input:/dev/input:ro
    devices: [/dev/dri, /dev/uinput, /dev/nvidia0, /dev/nvidiactl, /dev/nvidia-modeset, /dev/nvidia-uvm]
    environment: [DISPLAY=:0, TZ=Europe/Bratislava]
    privileged: true
    profiles: [tv]
  
  jellyfin:
    image: jellyfin/jellyfin:10.10
    container_name: jellyfin
    restart: unless-stopped
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - ./jellyfin/config:/config
      - /mnt/files/media:/media:ro
    environment: [TZ=Europe/Bratislava]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['0'], capabilities: [gpu]}]
    networks: [scarlix-net]

  minecraft:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
    # v18.7.7 P1: GHCR (ghcr.io) requires auth to query tags via API — can't
    #   auto-verify in CI. Before the v18.7.7 release goes out, manually check
    #   https://github.com/pumpkin-mc/pumpkin/pkgs/container/pumpkin for version
    #   tags, then replace `:latest` below with the verified `:vX.Y.Z` tag.
    image: ghcr.io/pumpkin-mc/pumpkin:latest
    container_name: minecraft
    restart: unless-stopped
    ports: ["127.0.0.1:25565:25565"]
    volumes: ["./minecraft/data:/data"]
    environment: [MAX_MEMORY=4G, TZ=Europe/Bratislava]
    networks: [scarlix-net]

networks:
  scarlix-net: {external: true}
