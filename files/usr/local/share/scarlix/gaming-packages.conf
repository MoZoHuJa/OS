# ============================================================================
# SCARLIX OS v19.3.1 — Gaming stack package manifest
# ============================================================================
#
# Single source of truth for BOTH:
#   1. scarlix-gaming-install  — installs pacman/aur rows for a chosen profile
#   2. scarlix-host-bridge     — detects inventory rows for the dashboard
#      (/api/gaming via host-status.json)
#
# Format (pipe-separated, ASCII only, no spaces inside fields 1-3):
#   profile|channel|package|kind|display-name
#
#   profile:  minimal   = base desktop gaming set (mirrors the packages.x86_64
#                         gaming block; default, installed by install.sh)
#             full      = opt-in extras (minimal + these via
#                         scarlix-gaming-install --profile full)
#             inventory = detection-only rows: NEVER installed by
#                         scarlix-gaming-install (owned by install.sh,
#                         systemd units or docker compose)
#   channel:  pacman | aur | flatpak | systemd | compose
#             (the install script processes ONLY pacman + aur)
#   kind:     launcher | compatibility | performance | streaming | server
#
# Rules (enforced by the smoke test):
#   - every row has exactly 5 fields, no duplicates per (channel, package)
#   - pacman/aur package names must exist in the official repos / AUR
#   - the install script NEVER removes packages (headless = report only)
#
# v19.3.1 decisions (see gaming/README.md):
#   - RetroArch assets ship as three per-UI packages (xmb/ozone/glui) — all
#     three are included in gaming-full so any menu theme works.
#   - Bottles uses the AUR channel to stay on the single existing,
#     battle-tested non-root yay flow. Flatpak is documented as the
#     upstream-preferred manual alternative and is detected (inventory row
#     below) but never installed automatically.
#   - gaming-headless is NOT a row set: an AI/server-only machine comments
#     out the gaming block in packages.x86_64 before install (documented).
# ============================================================================

# --- gaming-minimal (base set; matches the packages.x86_64 gaming block) ---
minimal|pacman|steam|launcher|Steam
minimal|pacman|wine|compatibility|Wine
minimal|pacman|wine-gecko|compatibility|Wine Gecko
minimal|pacman|wine-mono|compatibility|Wine Mono
minimal|pacman|lutris|launcher|Lutris
# v19.3.1 gap fix: explicit Vulkan loaders (64+32-bit). Steam pulls these as
# dependencies anyway; declaring them makes the Proton/Vulkan requirement
# explicit and verifiable instead of implicit.
minimal|pacman|vulkan-icd-loader|compatibility|Vulkan loader (64-bit)
minimal|pacman|lib32-vulkan-icd-loader|compatibility|Vulkan loader (32-bit)

# --- gaming-full extras (opt-in) ---
full|pacman|retroarch|launcher|RetroArch
full|pacman|retroarch-assets-xmb|launcher|RetroArch XMB menu assets
full|pacman|retroarch-assets-ozone|launcher|RetroArch Ozone menu assets
full|pacman|retroarch-assets-glui|launcher|RetroArch GLUI menu assets
full|pacman|gamescope|performance|Gamescope
full|pacman|mangohud|performance|MangoHud
full|pacman|gamemode|performance|GameMode
full|pacman|lib32-gamemode|performance|GameMode (32-bit)
full|aur|heroic-games-launcher-bin|launcher|Heroic Games Launcher
full|aur|itch-setup-bin|launcher|itch
full|aur|bottles|launcher|Bottles

# --- inventory-only rows (detection, never auto-installed) ---
inventory|systemd|sunshine|streaming|Sunshine (native, game-mode service)
inventory|compose|sunshine-tv|streaming|Sunshine TV (Docker, compose profile tv)
inventory|compose|jellyfin|server|Jellyfin (Docker, media server)
inventory|compose|minecraft|server|Minecraft Pumpkin (Docker, game server)
# Bottles Flatpak alternative — detected when manually installed, never installed by us
inventory|flatpak|com.usebottles.bottles|launcher|Bottles (Flatpak alternative)
