name: CI

on:
  push:
    branches: [main, 'v18.*']
    # v18.7.6 P1: trigger on tags (was: branches only → v18.7.6 tag push skipped CI)
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: |
          shellcheck -S warning install.sh
          shellcheck -S warning files/usr/local/bin/scarlix-mode
          shellcheck -S warning files/usr/local/bin/scarlix-wizard
          shellcheck -S warning files/usr/local/bin/scarlix-doctor
          shellcheck -S warning files/usr/local/bin/model-manager.sh
          shellcheck -S warning files/usr/local/bin/download-models.sh
          shellcheck -S warning files/usr/local/bin/scarlix-host-bridge
          shellcheck -S warning files/usr/local/bin/generate-sha256sums.sh
          shellcheck -S warning files/usr/local/bin/generate-litellm-config.sh
          shellcheck -S warning files/usr/local/bin/scarlix
          shellcheck -S warning files/usr/local/bin/scarlix-smoke-test.sh
          shellcheck -S warning files/usr/local/bin/scarlix-gpu 2>/dev/null || true  # Go binary, not a shell script — skip if not present
          shellcheck -S warning files/etc/systemd/system/generate-env.sh

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          bash -n install.sh
          for f in files/usr/local/bin/*; do bash -n "$f"; done
          for f in files/etc/systemd/system/*.sh; do bash -n "$f"; done
          for f in files/etc/pacman.d/hooks/*.sh; do bash -n "$f"; done

  yaml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        # v18.7.6 P2: pin pyyaml (was: floating dependency → non-reproducible CI)
        run: pip install "pyyaml==6.0.2"
      - name: Validate YAML files
        run: |
          python -c "import yaml; yaml.safe_load(open('models.yaml')); print('models.yaml OK')"
          find . -name 'docker-compose*.yml' -not -path './.git/*' | while read f; do
            python -c "import yaml; yaml.safe_load(open('$f')); print('$f OK')" || exit 1
          done

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ALL Docker Compose files
        run: |
          find . -name 'docker-compose*.yml' -not -path './.git/*' | while read f; do
            echo "Checking $f..."
            # v18.7.8 P1: Fix grep -c + || echo 0 bug (was: `grep -c` exits 1 when
            #   0 matches → `|| echo 0` runs → DUP=$'0\n0' → `[ "$DUP" -gt 1 ]`
            #   → "integer expression expected" → CI fails on compose files
            #   WITHOUT scarlix-net like gaming/monitoring. Now: grep -c already
            #   prints 0 on no match, so just suppress the exit code with `|| true`.)
            DUP=$(grep -c "^  scarlix-net:" "$f" 2>/dev/null || true)
            [ -z "$DUP" ] && DUP=0
            if [ "$DUP" -gt 1 ]; then
              echo "ERROR: Duplicate scarlix-net key in $f ($DUP occurrences)"
              exit 1
            fi
            if grep -q "scarlix_ai" "$f"; then
              echo "ERROR: scarlix_ai found in $f — should be scarlix-net"
              exit 1
            fi
            if grep -q "scarlix_net" "$f"; then
              echo "ERROR: scarlix_net found in $f — should be scarlix-net"
              exit 1
            fi
            if grep -q "scarlix-net, scarlix-net" "$f"; then
              echo "ERROR: Duplicate scarlix-net in service networks in $f"
              exit 1
            fi
            # v17.9.8: reject docker.sock mount in ScarliHQ compose (privilege boundary)
            if [ "$f" = "./scarlihq/docker-compose.yml" ] && grep -q "docker.sock" "$f"; then
              echo "ERROR: ScarliHQ compose mounts docker.sock — use host-bridge instead (v17.9.8)"
              exit 1
            fi
          done
          echo "All compose files validated"

      - name: Validate Docker Compose configs
        run: |
          # v18.8.6 P2: docker compose config validation (was: only YAML syntax checked,
          #   not interpolation/profiles/env references)
          # Create a test .env with all required vars
          cat > /tmp/test-scarlix.env << 'TESTEOF'
          SCARLIHQ_TOKEN=test-token
          LITELLM_MASTER_KEY=sk-test-key
          SCARLIX_VERSION=$(cat VERSION)
          SGLANG_MODEL_PATH=/models/test
          VLLM_MODEL_PATH=/models/test
          LLAMACPP_MODEL_PATH=/models/test.gguf
          SGLANG_MEM_FRACTION=0.85
          VLLM_GPU_UTIL=0.85
          SGLANG_CONTEXT_LENGTH=32768
          SGLANG_CHUNKED_PREFILL=4096
          SGLANG_MAX_RUNNING=4
          # v18.9.0 P2-14: vars added in v18.8.6-18.8.9 (was: missing from test
          #   .env → docker compose config silently fell back to defaults, hiding
          #   real interpolation bugs. Now: all env vars present.)
          SGLANG_SHM_SIZE=8gb
          OLLAMA_KEEP_ALIVE=15m
          OLLAMA_NUM_PARALLEL=2
          VLLM_TENSOR_PARALLEL=1
          VLLM_MAX_MODEL_LEN=32768
          LLAMACPP_CONTEXT_SIZE=32768
          LLAMACPP_THREADS=16
          LLAMACPP_CACHE_TYPE_K=q4_0
          LLAMACPP_CACHE_TYPE_V=q4_0
          TESTEOF
          find . -name 'docker-compose*.yml' -not -path './.git/*' | while read f; do
            echo "Validating $f..."
            docker compose --env-file /tmp/test-scarlix.env -f "$f" config --quiet 2>&1 || { echo "FAIL: $f"; exit 1; }
          done
          echo "All compose configs valid"

      - name: Test models.yaml → .env → compose pipeline
        run: |
          # v18.9.0 P2-15: End-to-end config wiring test (was: only syntax checked,
          #   not actual models.yaml → scarlix-mode → .env → compose rendering)
          # Create test models.yaml with known non-default values
          cat > /tmp/test-models.yaml << 'MEOF'
          sglang:
            model_path: "/models/TestModel-AWQ"
            hf_repo: "test/test"
            context_length: 12345
            mem_fraction: 0.82
            chunked_prefill_size: 1234
            max_running_requests: 7
            shm_size: "5gb"
          vllm:
            model_path: "/models/TestModel-AWQ"
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.85
            max_model_len: 16384
          beellama:
            hf_repo: "test/test-gguf"
            hf_file: "TestModel-Q4_K_M.gguf"
            context_size: 8192
            threads: 8
            cache_type_k: "q4_0"
            cache_type_v: "q4_0"
          ollama:
            model: "test-model:3b"
            keep_alive: "10m"
            num_parallel: 4
          MEOF
          # Generate .env from test models.yaml (simulate scarlix-mode generate_env_file)
          python3 << 'GENEOF'
          import yaml, os
          m = yaml.safe_load(open('/tmp/test-models.yaml'))
          with open('/tmp/test-runtime.env', 'w') as f:
              f.write(f"SGLANG_MODEL_PATH={m['sglang']['model_path']}\n")
              f.write(f"SGLANG_MEM_FRACTION={m['sglang']['mem_fraction']}\n")
              f.write(f"SGLANG_CONTEXT_LENGTH={m['sglang']['context_length']}\n")
              f.write(f"SGLANG_CHUNKED_PREFILL={m['sglang']['chunked_prefill_size']}\n")
              f.write(f"SGLANG_MAX_RUNNING={m['sglang']['max_running_requests']}\n")
              f.write(f"SGLANG_SHM_SIZE={m['sglang']['shm_size']}\n")
              f.write(f"VLLM_TENSOR_PARALLEL={m['vllm']['tensor_parallel_size']}\n")
              f.write(f"VLLM_MAX_MODEL_LEN={m['vllm']['max_model_len']}\n")
              f.write(f"LLAMACPP_CONTEXT_SIZE={m['beellama']['context_size']}\n")
              f.write(f"LLAMACPP_THREADS={m['beellama']['threads']}\n")
              f.write(f"OLLAMA_KEEP_ALIVE={m['ollama']['keep_alive']}\n")
              f.write(f"OLLAMA_NUM_PARALLEL={m['ollama']['num_parallel']}\n")
          GENEOF
          # Validate that compose renders with these values
          # v18.9.0 fix: shm_size is normalized by docker compose config (5gb → bytes),
          # so grep for the key name, not the value
          docker compose --env-file /tmp/test-runtime.env -f ai/sglang/docker-compose.yml config | grep -q "12345" || { echo "FAIL: SGLANG_CONTEXT_LENGTH not wired"; exit 1; }
          docker compose --env-file /tmp/test-runtime.env -f ai/sglang/docker-compose.yml config | grep -q "shm_size" || { echo "FAIL: SGLANG_SHM_SIZE not wired"; exit 1; }
          docker compose --env-file /tmp/test-runtime.env -f ai/vllm/docker-compose.yml config | grep -q "16384" || { echo "FAIL: VLLM_MAX_MODEL_LEN not wired"; exit 1; }
          docker compose --env-file /tmp/test-runtime.env -f ai/llamacpp/docker-compose.yml config | grep -q "8192" || { echo "FAIL: LLAMACPP_CONTEXT_SIZE not wired"; exit 1; }
          docker compose --env-file /tmp/test-runtime.env -f ai/ollama/docker-compose.yml config | grep -q "10m" || { echo "FAIL: OLLAMA_KEEP_ALIVE not wired"; exit 1; }
          echo "All env wiring verified: models.yaml values appear in rendered compose configs"

  # v17.9.8 P2: Go build + vet + test for ScarliHQ (catches compile errors before release)
  # v18.9.8 P1-2: systemd unit file validation (was: .service/.timer not validated →
  #   syntax errors only caught at runtime on target system)
  # v19.0.1 fix: systemd-analyze verify checks ExecStart exists → fails on CI runner
  #   where /usr/local/bin/scarlix-* aren't installed. Now: only check INI syntax.
  systemd-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate systemd unit files (syntax only)
        run: |
          # systemd-analyze verify fails if ExecStart command doesn't exist on the
          # runner. We only want to check INI syntax, not runtime availability.
          # Use --root to prevent path resolution, and filter out expected warnings.
          find files/etc/systemd/system \( -name '*.service' -o -name '*.timer' \) | while read f; do
            echo "Validating $f..."
            # Check basic INI structure: must have [Unit] or [Service] or [Timer] section
            if ! grep -qE '^\[(Unit|Service|Timer|Install)\]' "$f"; then
              echo "FAIL: $f — no valid systemd section found"
              exit 1
            fi
            # Check for obvious syntax errors (unbalanced quotes in values)
            if grep -nE '^[^#\[].*[^"]"' "$f" 2>/dev/null | grep -v '="' | grep -v '^#'; then
              echo "WARN: $f — possible unbalanced quotes (review manually)"
            fi
            echo "  ✓ $f syntax OK"
          done
          echo "All systemd units valid"

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: go vet
        working-directory: scarlihq
        run: |
          # v18.2 P1: go.sum generated at build time (not committed — no local Go to generate)
          go mod download
          go mod verify
          go vet ./...
      - name: go build
        working-directory: scarlihq
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/scarlihq ./cmd/scarlihq
          echo "ScarliHQ binary built successfully"
          # v18.7.8 P1: Also build scarlix-bridge-reader (was: only ./cmd/scarlihq
          #   → bridge-reader compile errors weren't caught by go-build job, only by
          #   the slower scarlihq-docker-build job. Now both binaries are vetted here.)
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/scarlix-bridge-reader ./cmd/scarlix-bridge-reader
          echo "scarlix-bridge-reader binary built successfully"
      - name: go test
        working-directory: scarlihq
        # v18.3 P1: removed `|| echo "(no tests yet)"` mask (was: hid test failures)
        run: |
          # Only run if Go packages exist (avoids "no packages" error on empty test suite)
          if go list ./... 2>/dev/null | grep -q .; then
            go test ./...
          else
            echo "(no Go test files yet — OK)"
          fi

  # v17.9.8 P2: Real ScarliHQ Docker build (catches Dockerfile + go.mod issues)
  # v17.9.9 P2: Added runtime smoke test (container starts + /api/health responds)
  scarlihq-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ScarliHQ Docker image
        run: |
          # v18.0.0 P2: use VERSION file as build-arg (was: hardcoded default in Dockerfile)
          SCARLIX_VERSION=$(cat VERSION)
          docker build --build-arg SCARLIX_VERSION="$SCARLIX_VERSION" -t scarlihq:ci scarlihq/
          docker images scarlihq:ci
          echo "ScarliHQ image built (version $SCARLIX_VERSION) — size:"
          docker image inspect scarlihq:ci --format '{{.Size}}' | awk '{printf "  %.1f MB\n", $1/1024/1024}'
      # v18.8.2 P2: Save image as artifact so integration-test reuses it (was:
      #   integration-test rebuilt the same image → slower CI. Now: docker save
      #   → upload-artifact → download-artifact → docker load. ~20MB alpine image
      #   = fast transfer, saves ~30s build time per integration run.)
      - name: Save ScarliHQ image as artifact
        run: docker save scarlihq:ci | gzip > /tmp/scarlihq-ci.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: scarlihq-ci-image
          path: /tmp/scarlihq-ci.tar.gz
          retention-days: 1
      - name: Runtime smoke test (container starts + port responds)
        run: |
          # v18.7.6 P2: trap cleanup so failures still tear down the container
          # (was: exit 1 skipped `docker stop/rm scarlihq-test` → container stayed running)
          trap 'docker logs scarlihq-test 2>/dev/null | tail -20; docker stop scarlihq-test 2>/dev/null || true; docker rm scarlihq-test 2>/dev/null || true' EXIT
          # v18.0.0: use bridge-input/ layout (not bridge/)
          # v18.2 P2: chown 65532 (nonroot in ScarliHQ alpine image — was missing → mode POST 202 fails)
          mkdir -p /tmp/scarlix-test/bridge-input /tmp/scarlix-test/bridge-state
          # v18.5.1: chmod BEFORE chown (was: chmod after chown → EACCES on foreign-owned file)
          chmod 700 /tmp/scarlix-test/bridge-input /tmp/scarlix-test/bridge-state
          sudo chown -R 65532:65532 /tmp/scarlix-test/bridge-input
          # v18.5.1: use valid RFC3339 timestamp (was: "test" → stale=true, but shouldn't break)
          TS=$(date -Iseconds)
          # v18.7.6 P1: read version from VERSION file (was: hardcoded "18.5.1" → stale)
          SCARLIX_VERSION=$(cat VERSION)
          echo "{\"timestamp\":\"$TS\",\"version\":\"$SCARLIX_VERSION\",\"mode\":\"unknown\",\"mode_transition\":{\"requested\":\"\",\"state\":\"none\",\"retry_count\":0,\"last_error\":\"\",\"last_timestamp\":\"\"},\"gpus\":[],\"containers\":[],\"disk\":{}}" > /tmp/scarlix-test/host-status.json
          docker run -d --name scarlihq-test -p 8090:8090 \
            -e SCARLIHQ_TOKEN=test-token \
            -v /tmp/scarlix-test:/var/lib/scarlix:ro \
            -v /tmp/scarlix-test/bridge-input:/var/lib/scarlix/bridge-input:rw \
            scarlihq:ci
          # v18.7.6 P1: Poll for readiness (was: sleep 5 → flaky on slow runners)
          # v18.7.7 P1: READY flag check (was: loop ended without checking if
          #   break happened → test continued with a dead server → cryptic
          #   "expected 401" failure instead of "server never became ready").
          # v18.7.8 P0: Accept ANY HTTP response (was: `curl -sf` → 401 counts
          #   as failure because -f fails on 4xx → READY stays 0 → CI ALWAYS
          #   fails "never became ready" even though server is up). /api/health
          #   is authed, so 401 = server is running. Now: any non-000 code = up.
          READY=0
          for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 http://127.0.0.1:8090/api/health 2>/dev/null) || code="000"
              if [ "$code" != "000" ]; then
                  READY=1; break
              fi
              sleep 1
          done
          if [ "$READY" -ne 1 ]; then
              echo "FAIL: ScarliHQ never became ready after 30s"
              docker logs scarlihq-test 2>&1 | tail -30
              exit 1
          fi
          # v18.5.1: print container status + logs for debugging
          docker ps -a --filter name=scarlihq-test --format '{{.Status}}'
          docker logs scarlihq-test 2>&1 | head -20
          # Health: no token → 401, with token → 200
          # v18.8 P0: Fix `|| echo 000` → 000000 bug (was: curl fails → prints 000
          #   to stdout AND exits 1 → || echo 000 adds another 000 → code=000000
          #   → `[ "$code" != "000" ]` = TRUE → false healthy). Now: separate
          #   assignment + fallback so code is exactly "000" on failure.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/api/health) || HTTP_CODE="000"
          echo "Health (no token): HTTP $HTTP_CODE (expected 401)"
          [ "$HTTP_CODE" = "401" ] || { echo "FAIL: expected 401"; docker logs scarlihq-test; exit 1; }
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer test-token" http://127.0.0.1:8090/api/health) || HTTP_CODE="000"
          echo "Health (with token): HTTP $HTTP_CODE (expected 200)"
          [ "$HTTP_CODE" = "200" ] || { echo "FAIL: expected 200"; docker logs scarlihq-test; exit 1; }
          # v18.0.0 P2: mode POST writes desired-mode to bridge-input/ (test the write path)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer test-token" "http://127.0.0.1:8090/api/mode?set=ai") || HTTP_CODE="000"
          echo "Mode POST (set=ai): HTTP $HTTP_CODE (expected 202)"
          [ "$HTTP_CODE" = "202" ] || { echo "FAIL: expected 202"; docker logs scarlihq-test; exit 1; }
          # Check desired-mode file was written (container must be able to write to bridge-input/)
          sudo ls -la /tmp/scarlix-test/bridge-input/desired-mode && echo "desired-mode written ✓"
          # v18.7: Clean up desired-mode before next test (was: file existed → 409 instead of 400)
          sudo rm -f /tmp/scarlix-test/bridge-input/desired-mode
          # Invalid mode → 400
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer test-token" "http://127.0.0.1:8090/api/mode?set=invalid") || HTTP_CODE="000"
          echo "Mode POST (set=invalid): HTTP $HTTP_CODE (expected 400)"
          [ "$HTTP_CODE" = "400" ] || { echo "FAIL: expected 400"; docker logs scarlihq-test; exit 1; }
          echo "Smoke test PASSED — ScarliHQ starts + auth + mode write + error codes"

  # v18.7.5 P2: Integration tests — real API + WS ticket + mode switch
  # v18.7.7 P1: Added real WebSocket lifecycle test (ticket→upgrade→reuse→reject)
  integration-test:
    runs-on: ubuntu-latest
    needs: scarlihq-docker-build
    steps:
      - uses: actions/checkout@v4
      # v18.8.2 P2: Download pre-built image artifact (was: rebuilt same image →
      #   slower CI. Now: download from scarlihq-docker-build job + docker load.)
      - uses: actions/download-artifact@v4
        with:
          name: scarlihq-ci-image
          path: /tmp
      - name: Load ScarliHQ image from artifact
        run: docker load < /tmp/scarlihq-ci.tar.gz
      # v18.7.7 P1: Install Python websockets library for the real WS lifecycle test
      # (Test 10). Pinned for reproducibility (same rationale as pyyaml pinning).
      # v18.8 P1: Add setup-python (was: bare `pip install` on ubuntu-latest 24.04
      #   → PEP 668 "externally-managed-environment" error → job fails before Test 10).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python websockets + PyYAML libraries
        # v18.8.3 P1 fix: Added pyyaml (was: only websockets → Test 12 `import yaml`
        #   failed with ModuleNotFoundError. Test 12 validates production LiteLLM
        #   config.yaml which requires PyYAML to parse.)
        run: pip install "websockets==13.1" "pyyaml==6.0.2"
      - name: Integration tests
        run: |
          # v18.7.6 P1: trap cleanup so any `exit 1` still tears down the container
          # (was: exit 1 skipped `docker stop/rm scarlihq-int` → container stayed running)
          # v18.8.2 P1: trap also cleans up litellm-test (Test 11 container)
          trap 'docker logs scarlihq-int 2>/dev/null | tail -20; docker stop scarlihq-int litellm-test 2>/dev/null || true; docker rm scarlihq-int litellm-test 2>/dev/null || true' EXIT
          # Setup test environment
          mkdir -p /tmp/scarlix-test/bridge-input /tmp/scarlix-test/bridge-state
          chmod 700 /tmp/scarlix-test/bridge-input /tmp/scarlix-test/bridge-state
          sudo chown -R 65532:65532 /tmp/scarlix-test/bridge-input
          TS=$(date -Iseconds)
          # v18.7.6 P1: read version from VERSION file (was: hardcoded "18.7.5" → stale)
          SCARLIX_VERSION=$(cat VERSION)
          echo "{\"timestamp\":\"$TS\",\"version\":\"$SCARLIX_VERSION\",\"mode\":\"unknown\",\"mode_transition\":{\"requested\":\"\",\"state\":\"none\",\"retry_count\":0,\"last_error\":\"\",\"last_timestamp\":\"\"},\"gpus\":[],\"containers\":[],\"disk\":{}}" > /tmp/scarlix-test/host-status.json

          # Start ScarliHQ
          docker run -d --name scarlihq-int -p 8090:8090 \
            -e SCARLIHQ_TOKEN=test-token \
            -v /tmp/scarlix-test:/var/lib/scarlix:ro \
            -v /tmp/scarlix-test/bridge-input:/var/lib/scarlix/bridge-input:rw \
            scarlihq:ci
          # v18.7.6 P1: Poll for readiness (was: sleep 5 → flaky on slow runners)
          # v18.7.7 P1: READY flag check (was: loop ended without checking if
          #   break happened → test continued with a dead server → cryptic
          #   "Test 1 failed" instead of "server never became ready").
          # v18.7.8 P0: Accept ANY HTTP response (was: `curl -sf` → 401 counts
          #   as failure because -f fails on 4xx → READY stays 0 → CI ALWAYS
          #   fails "never became ready" even though server is up). /api/health
          #   is authed, so 401 = server is running. Now: any non-000 code = up.
          READY=0
          for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 http://127.0.0.1:8090/api/health 2>/dev/null) || code="000"
              if [ "$code" != "000" ]; then
                  READY=1; break
              fi
              sleep 1
          done
          if [ "$READY" -ne 1 ]; then
              echo "FAIL: ScarliHQ never became ready after 30s"
              docker logs scarlihq-int 2>&1 | tail -30
              exit 1
          fi

          # Test 1: Health without token → 401
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/api/health)
          echo "Test 1 (no token): $HTTP (expected 401)"
          [ "$HTTP" = "401" ] || { echo "FAIL"; docker logs scarlihq-int; exit 1; }

          # Test 2: Health with token → 200 + version
          RESP=$(curl -sf -H "Authorization: Bearer test-token" http://127.0.0.1:8090/api/health)
          echo "Test 2 (with token): $RESP"
          # v18.7.6 P1: use python3 for JSON parsing (was: grep '"status":"ok"' → fails on whitespace)
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok', f'status={d[\"status\"]}'; print('OK')" || { echo "FAIL: no ok status"; exit 1; }

          # Test 3: Mode POST → 202
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer test-token" "http://127.0.0.1:8090/api/mode?set=ai")
          echo "Test 3 (mode=ai): $HTTP (expected 202)"
          [ "$HTTP" = "202" ] || { echo "FAIL"; exit 1; }

          # Test 4: Mode POST again → 409 (desired-mode exists = pending)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer test-token" "http://127.0.0.1:8090/api/mode?set=game")
          echo "Test 4 (mode=game, pending): $HTTP (expected 409)"
