name: SCARLIX OS v12 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-configs:
    name: Validate Configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          find . -name "*.yaml" -o -name "*.yml" | grep -v node_modules | while read f; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "OK: $f" || exit 1
          done

      - name: Validate JSON files
        run: |
          find . -name "*.json" | grep -v node_modules | while read f; do
            python3 -c "import json; json.load(open('$f'))" && echo "OK: $f" || exit 1
          done

      - name: Validate docker-compose files
        run: |
          find . -name "docker-compose.yml" | while read f; do
            docker compose -f "$f" config -q && echo "OK: $f" || exit 1
          done
        env:
          # Placeholder env vars for validation
          POSTGRES_PASSWORD: test
          REDIS_PASSWORD: test
          BUZZ_POSTGRES_PASSWORD: test
          BUZZ_MINIO_PASSWORD: test
          GITEA_DB_PASSWORD: test
          COOLIFY_APP_KEY: test
          COOLIFY_DB_PASSWORD: test
          NEXTCLOUD_DB_PASSWORD: test
          PHOTOPRISM_ADMIN_PASSWORD: test
          N8N_PASSWORD: test
          N8N_DB_PASSWORD: test
          GRAFANA_PASSWORD: test
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_ZMOR_CHAT_ID: test
          CF_API_TOKEN: test

  build-scarlihq:
    name: Build ScarliHQ Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        working-directory: scarlihq
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o scarlihq-linux-amd64 ./cmd/scarlihq

      - name: Verify binary
        working-directory: scarlihq
        run: file scarlihq-linux-amd64

  shellcheck:
    name: Shell Script Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
