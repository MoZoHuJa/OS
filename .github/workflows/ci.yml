          # Test 8: MCP JSON-RPC ping
          MCP_RESP=$(curl -sf -X POST -H "Authorization: Bearer test-token" -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"ping","id":1}' http://127.0.0.1:8090/rpc)
          echo "Test 8 (MCP ping): $MCP_RESP"
          echo "$MCP_RESP" | grep -q '"jsonrpc":"2.0"' || { echo "FAIL: no jsonrpc"; exit 1; }

          # Test 9: MCP trailing JSON rejected
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer test-token" \
