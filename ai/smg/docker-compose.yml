services:
  smg:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
    image: ghcr.io/lightseekorg/smg:latest
    container_name: smg
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    environment:
      - SMG_CONFIG=/config/config.yaml
      - SMG_PORT=4000
      - TZ=Europe/Bratislava
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  scarlix-net: {external: true}
