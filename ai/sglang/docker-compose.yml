# SCARLIX OS v17.7 — SGLang (Tier-1, GPU 0)
# v17.7: healthcheck CMD-SHELL (curl may not be in image), .env file for model path
# Model path read from .env file (generated by scarlix-mode from models.yaml)
services:
  sglang:
    image: ghcr.io/sgl-project/sglang:latest-cu128
    container_name: sglang
    restart: unless-stopped
    ports:
      - "30000:30000"
    volumes:
      - /var/lib/sglang/cache:/root/.cache/huggingface
      - /models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >
      python -m sglang.launch_server
      --model-path ${SGLANG_MODEL_PATH:-/models/Qwen3-14B-Instruct-AWQ}
      --port 30000
      --host 0.0.0.0
      --mem-fraction-static 0.90
      --context-length 32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:30000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
networks:
  scarlix-net: { external: true }
