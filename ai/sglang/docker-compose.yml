# SCARLIX OS v18.8.3 — SGLang (Tier-1, GPU 0)
# v17.9.7: --disable-flashinfer (Blackwell sm_120 kernels missing in v0.4.4)
# v17.9.5: Pinned image v0.4.4-cu128 (was latest-cu128 — unreproducible)
# v18.8.3 P1 (D): context-length + chunked-prefill + max-running from env (was: hardcoded)
services:
  sglang:
    image: ghcr.io/sgl-project/sglang:v0.4.4-cu128
    container_name: sglang
    restart: unless-stopped
    ports:
      - "127.0.0.1:30000:30000"
    volumes:
      - /var/lib/sglang/cache:/root/.cache/huggingface
      - /models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # v18.8.6 P1: shm_size for SGLang multiprocessing (was: default 64MB → hangs/OOM
    #   on long context + agent workload. 8gb is safe for 16GB GPU.)
    shm_size: "8gb"
    command: >
      python -m sglang.launch_server
      --model-path ${SGLANG_MODEL_PATH:-/models/Qwen3-14B-AWQ}
      --port 30000
      --host 0.0.0.0
      --mem-fraction-static ${SGLANG_MEM_FRACTION:-0.85}
      --context-length ${SGLANG_CONTEXT_LENGTH:-32768}
      --chunked-prefill-size ${SGLANG_CHUNKED_PREFILL:-4096}
      --max-running-requests ${SGLANG_MAX_RUNNING:-4}
      --disable-flashinfer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:30000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
networks:
  scarlix-net: { external: true }
