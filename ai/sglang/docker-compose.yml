# SCARLIX OS v19.1.18 — SGLang Tier-1 GPU inference (Blackwell sm_120, Qwen3)
# v19.0.5 P2: Header bumped from v18.8.3 (was stale by 6 minor releases even
#   though the image tag was updated to v0.4.9.post6 in v19.0.3. Header only —
#   historical P-fix comments retained below for audit trail.)
# v17.9.7: --disable-flashinfer (Blackwell sm_120 kernels missing in v0.4.4)
# v18.8.3 P1 (D): context-length + chunked-prefill + max-running from env (was: hardcoded)
services:
  sglang:
    # v19.0.3 P0-1: FIXED IMAGE REGISTRY. Was ghcr.io/sgl-project/sglang:v0.4.6.post1-cu128
    #   (ghcr returns 403/DENIED; tag 404 on lmsysorg/sglang too — cu128 variant only
    #   exists from v0.4.8+ as -b200/-gb200). P0 BLOCKER: scarlix-mode ai pulls this.
    #   Now: lmsysorg/sglang:v0.4.9.post6-cu128-b200 (verified HTTP 200 via registry API).
    #   Supports Qwen3 (requires >= 0.4.6.post1). --disable-flashinfer kept.
    #   SGLang >= 0.4.6.post1 per official Qwen documentation. v0.4.4 lacks
    #   Qwen3 architecture support → runtime failure on model load.)
    # v19.0.1 P1: PRE-RELEASE TAG VERIFICATION NEEDED. The ghcr.io anonymous token
    #   endpoint returns 403/DENIED for sgl-project/sglang, so the tag
    #   v0.4.6.post1-cu128 could NOT be verified to exist via registry API in
    #   sandbox. Before release, on a GPU host run:
    #     docker pull ghcr.io/sgl-project/sglang:v0.4.6.post1-cu128
    #   If that fails, check https://github.com/sgl-project/sglang/pkgs/container/sglang
    #   for the correct tag (the cu128 CUDA-12.8 variant may be named differently,
    #   e.g. v0.4.6.post1-cu121 or a plain v0.4.6.post1). Do NOT blindly change the
    #   CUDA suffix — a wrong variant breaks GPU passthrough. Also confirm
    #   --disable-flashinfer still exists in `sglang.launch_server --help`.
    image: lmsysorg/sglang:v0.4.9.post6-cu128-b200
    container_name: sglang
    restart: unless-stopped
    ports:
      - "127.0.0.1:30000:30000"
    volumes:
      - /var/lib/sglang/cache:/root/.cache/huggingface
      - /models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # v18.8.6 P1: shm_size for SGLang multiprocessing (was: default 64MB → hangs/OOM
    #   on long context + agent workload. 8gb is safe for 16GB GPU.)
    # v18.8.7 P1-06: shm_size from ${SGLANG_SHM_SIZE} env (was: hardcoded 8gb →
    #   couldn't change without editing compose. Now: models.yaml → .env → compose.)
    shm_size: ${SGLANG_SHM_SIZE:-4gb}
    command: >
      python -m sglang.launch_server
      --model-path ${SGLANG_MODEL_PATH:-/models/Qwen3-14B-AWQ}
      --port 30000
      --host 0.0.0.0
      --mem-fraction-static ${SGLANG_MEM_FRACTION:-0.80}
      --context-length ${SGLANG_CONTEXT_LENGTH:-32768}
      --chunked-prefill-size ${SGLANG_CHUNKED_PREFILL:-4096}
      --max-running-requests ${SGLANG_MAX_RUNNING:-4}
      --disable-flashinfer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:30000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
networks:
  scarlix-net: { external: true }
