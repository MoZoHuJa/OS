services:
  sglang:
    image: ghcr.io/sgl-project/sglang:v0.5.5-cu124
    container_name: sglang
    restart: unless-stopped
    ports:
      - "100.64.0.1:30000:30000"
      - "127.0.0.1:30000:30000"
    volumes:
      - /var/lib/sglang/cache:/root/.cache/huggingface
      - /models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >
      python -m sglang.launch_server
      --model-path /models/Qwen3-14B-Instruct
      --port 30000
      --host 0.0.0.0
      --mem-fraction-static 0.90
      --context-length 32768
      --enable-flashinfer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [scarlix_ai]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
networks:
  scarlix_ai: { external: true }
