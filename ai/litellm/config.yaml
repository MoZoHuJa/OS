# SCARLIX OS v18.8.1 — LiteLLM routing config
#
# v18.8 P0: Fixed hostname (was: llamacpp → beellama) + unified model name.
# v18.8.1 P0: Fixed model mapping (was: `model: openai/scarlix-default` — but
#   LiteLLM's `model` field is the ACTUAL backend model ID, not the logical alias.
#   SGLang serves Qwen3-14B-AWQ (from --model-path), Ollama serves qwen2.5:3b,
#   BeeLlama serves the GGUF file. Using `scarlix-default` as the backend model
#   name meant SGLang/Ollama would reject the request with "model not found".
#   Now: `model_name` = logical alias (what clients request), `litellm_params.model`
#   = real backend model ID (what the backend actually serves).
#
# v18.8.1 P0: Fixed fallback chain (was: `scarlix-default: ["scarlix-default"]` —
#   self-referencing, not a real fallback. LiteLLM fallbacks move to a DIFFERENT
#   model group on failure). Now: scarlix-default (SGLang) → scarlix-ollama →
#   scarlix-beellama — a real 3-tier chain matching scarlix-mode's fallback order.
#
# v18.8.1 P1: Fixed SQLite DB persistence (was: `sqlite:///litellm.db` → stored
#   at /app/litellm.db, but volume mounts ./data:/app/data → DB lost on recreate.
#   Now: `sqlite:////app/data/litellm.db` (4 slashes = absolute path) → persisted.
#
# Backend model IDs verified from models.yaml:
#   - SGLang: --model-path /models/Qwen3-14B-AWQ → OpenAI model ID = "Qwen3-14B-AWQ"
#   - Ollama: ollama pull qwen2.5:3b → model ID = "qwen2.5:3b"
#   - BeeLlama: --model /models/Qwen3-14B-Q4_K_M.gguf → llama.cpp /v1/models
#     returns the filename; LiteLLM openai/ prefix passes it through.

model_list:
  # PRIMARY: SGLang (GPU0) — Tier-1
  - model_name: scarlix-default
    litellm_params:
      model: openai/Qwen3-14B-AWQ
      api_base: http://sglang:30000/v1
      api_key: not-needed

  # FALLBACK-1: Ollama (CPU, qwen2.5:3b starter) — separate model group
  - model_name: scarlix-ollama
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://ollama-agent:11434

  # FALLBACK-2: BeeLlama / llama.cpp (CPU, Qwen3-14B-Q4_K_M.gguf) — separate group
  - model_name: scarlix-beellama
    litellm_params:
      model: openai/Qwen3-14B-Q4_K_M.gguf
      api_base: http://beellama:8080/v1
      api_key: not-needed

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  # v18.8.2 P1 (C-b): Real fallback chain (was: self-referencing scarlix-default→scarlix-default
  # in v18.8, and v18.8.1 had a 3-tier but comment claimed 4-tier matching scarlix-mode).
  # v18.8.2 decision: LiteLLM uses a SIMPLIFIED 3-tier chain (SGLang → Ollama → BeeLlama)
  # because vLLM is experimental (.experimental only) and LiteLLM routing shouldn't
  # depend on a backend that may not be running. scarlix-mode's start_verified_ai()
  # has the FULL 4-tier (SGLang → vLLM → BeeLlama → Ollama) for direct mode switching;
  # LiteLLM is a unified gateway for external clients and uses the stable 3-tier subset.
  # README documents this distinction. If vLLM is needed in LiteLLM later, add
  # scarlix-vllm model_name + api_base http://vllm:8000/v1 + add to fallbacks array.
  fallbacks:
    - scarlix-default: ["scarlix-ollama", "scarlix-beellama"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # v18.8.1 P1: Absolute path under mounted volume (was: sqlite:///litellm.db
  # → /app/litellm.db, not persisted). 4 slashes = absolute path in SQLite URI.
  database_url: sqlite:////app/data/litellm.db
