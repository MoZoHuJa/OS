services:
  litellm:
    # v18.8 P1: Pinned to stable version tag (was: :main-latest — development
    #   branch image, not a stable release → non-reproducible builds. Could get
    #   a broken main image at any time). Verified via ghcr.io/v2/berriai/litellm/
    #   tags/list — latest stable is main-v1.21.7. Update deliberately when upgrading.
    # v19.0.1 P1: updated from main-v1.16.19 (stale; v19.0.0 comment falsely claimed
    #   it was "latest stable" when 1.17.x–1.23.x already existed). Picked 1.21.7 as
    #   a conservative, well-tested bump (config.yaml schema unchanged since 1.16).
    #   PRE-RELEASE CHECK: run `curl -i http://127.0.0.1:4001/health/liveliness`
    #   after first start and confirm 200; if it fails, pin back to main-v1.16.19.
    image: ghcr.io/berriai/litellm:main-v1.23.9
    container_name: litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    command: --config /app/config.yaml --port 4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    networks: [scarlix-net]
    healthcheck:
      # v18.8.6 P0: /health requires auth when master_key is set → 401 → container
      #   marked unhealthy → healthcheck_and_restart recreates it every cycle.
      #   /health/liveliness is a liveness probe that does NOT require auth.
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 5
      # v18.8.2 P1: start_period (was: missing → wait_for_healthy could fail before
      #   LiteLLM finished reading config + connecting to backends). 30s is enough
      #   for LiteLLM cold start (no model loading, just config parse + DB init).
      start_period: 30s
networks:
  scarlix-net: { external: true }
