# SCARLIX OS v17.2.1 — vLLM (Tier-2 inference engine)
# High-throughput LLM serving: PagedAttention, continuous batching, multi-GPU TP+PP, Multi-LoRA
# Port: 8089 (OpenAI-compatible API)
#
# TARGET HARDWARE: Dual NVIDIA GPU (e.g. RTX 5060 Ti 16GB + RTX 4060 Ti 16GB = 32GB total)
#   GPU 0 (RTX 5060 Ti): vLLM TP shard 0 + SGLang
#   GPU 1 (RTX 4060 Ti): vLLM TP shard 1 + Ollama Agent
#   TP=2 splits model weights across both GPUs → Qwen3-72B (36GB) fits in 2×16GB
#
# Auto-enabled when wizard detects 2+ NVIDIA dGPUs (--profile experimental)
# Manual: touch /etc/scarlix/.experimental + systemctl restart scarlix-first-boot

version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    profiles: ["experimental"]  # v17.2.1: auto-enabled for 2+ GPU via wizard
    ports:
      - "8089:8000"
    volumes:
      - /models:/models:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /models/Qwen3-14B-Instruct-AWQ
      --tensor-parallel-size 2
      --gpu-memory-utilization 0.85
      --max-model-len 32768
      --enable-lora
      --max-loras 4
      --max-cpu-loras 8
      --lora-modules
        hermes=/models/lora/hermes
        opencode=/models/lora/opencode
        voice=/models/lora/voice
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    networks:
      - scarlix-net

networks:
  scarlix-net:
    external: true
    name: scarlix-net
