# SCARLIX OS v17.4 — vLLM (Tier-2 inference engine)
# v17.4: TP=1 default (single GPU) — safe for mixed GPU architectures.
#   RTX 5060 Ti (Blackwell sm_120) + RTX 4060 Ti (Ada sm_89) = different compute_cap.
#   vLLM TP=2 requires SAME compute_cap → use TP=1 (separate model per GPU).
#
# GPU assignment:
#   GPU 0 (RTX 5060 Ti): SGLang (Tier-1, primary)
#   GPU 1 (RTX 4060 Ti): vLLM (Tier-2, TP=1, separate model)
# Multi-LoRA: Hermes/omp/Voice share base model with separate LoRA heads on GPU1.

version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    profiles: ["experimental"]  # opt-in (wizard auto-suggests for 2+ GPU)
    ports:
      - "8089:8000"
    volumes:
      - /models:/models:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    command: >
      --model /models/Qwen3-14B-Instruct-AWQ
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --max-model-len 32768
      --enable-lora
      --max-loras 4
      --max-cpu-loras 8
      --lora-modules
        hermes=/models/lora/hermes
        opencode=/models/lora/opencode
        voice=/models/lora/voice
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    networks:
      - scarlix-net

networks:
  scarlix-net:
    external: true
    name: scarlix-net
