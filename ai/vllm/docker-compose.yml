# SCARLIX OS v17.5 — vLLM (Tier-2, GPU 1, TP=1)
# v17.5: TP=1 (mixed GPU safe — RTX 5060 Ti Blackwell + RTX 4060 Ti Ada)
#   No --profile experimental gate — starts if /etc/scarlix/.experimental flag exists
#   LoRA paths removed (didn't exist in /models/lora/)
#   Model path from env var ${VLLM_MODEL_PATH} (parsed from models.yaml by scarlix-mode)

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ports:
      - "8089:8000"
    volumes:
      - /models:/models:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    command: >
      --model ${VLLM_MODEL_PATH:-/models/Qwen3-14B-Instruct-AWQ}
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --max-model-len 32768
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    networks: [scarlix-net]

networks:
  scarlix-net: { external: true }
