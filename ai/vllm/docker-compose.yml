# SCARLIX OS v19.1.16 — vLLM (Tier-2, GPU 1, TP=1)
# v17.9: Pinned image v0.8.0 (was latest — unstable for Blackwell)
#   v0.8.0 verified on CUDA 12.8+ / Blackwell (sm_120)
# TP=1 (mixed GPU safe — RTX 5060 Ti Blackwell + RTX 4060 Ti Ada)

services:
  vllm:
    # v18.9.6 P0-02: Upgraded to v0.8.5 (was: v0.8.0 — Qwen3 requires
    #   vLLM >= 0.8.5 per official Qwen documentation.)
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8000"
    volumes:
      - /models:/models:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    # v19.1.15 P1: VLLM_TRUST_FLAG is set by scarlix-mode from models.yaml
    #   (trust_remote_code: true → "--trust-remote-code", false → "").
    #   Was: ${VLLM_TRUST_REMOTE_CODE:+--trust-remote-code} which treated
    #   "false"/"0"/"no" as truthy (any non-empty value enables the flag).
    #   Now: scarlix-mode validates the boolean and outputs VLLM_TRUST_FLAG.
    command: >
      --model ${VLLM_MODEL_PATH:-/models/Qwen3-14B-AWQ}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL:-1}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.85}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
      ${VLLM_TRUST_FLAG:-}
      --host 0.0.0.0
      --port 8000
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
networks:
  scarlix-net: { external: true }
