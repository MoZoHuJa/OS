# SCARLIX OS v17.1 — Laya (System-1 Router)
# FIX Q11a: Replaces Needle2 — 33ms non-autoregressive decision engine
# HITL Triage: fast yes/no/choice/score decisions before expensive LLM calls
# Port: 11440 (OpenAI-compatible API for easy routing)
#
# Apache-2.0 | https://github.com/NandhaKishorM/laya

version: "3.9"

services:
  laya:
    # v18.8 P1: Supply-chain risk — NOT YET PINNED (was: :latest → non-reproducible).
#   Docker Hub anonymous API returns NO_ACCESS for this repo → can't auto-verify
#   tags. Before FINAL release, manually check https://hub.docker.com/r/laya/decision-engine/tags for version tags,
#   then replace :latest with the verified :vX.Y.Z tag.
    image: laya/decision-engine:latest
    container_name: laya
    restart: unless-stopped
    profiles: ["experimental"]  # v17.2: opt-in only (replaces Needle2)
    ports:
      - "127.0.0.1:11440:8000"  # v18.7 P1: Bind to loopback (was 0.0.0.0:11440 — LAN exposed without auth)
    volumes:
      - /models/laya:/models/laya:ro
      - ./configs:/app/configs:ro
    environment:
      - LAYA_DEFAULT_CHECKPOINT=/models/laya/router-v1
      - LAYA_DEVICE=cuda:0
      - LAYA_MAX_BATCH=32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    command: >
      --host 0.0.0.0
      --port 8000
      --enable-mcp
    networks:
      - scarlix-net

networks:
  scarlix-net:
    external: true
    name: scarlix-net
