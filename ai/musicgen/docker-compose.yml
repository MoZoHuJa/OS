services:
  musicgen:
    build: .
    container_name: musicgen
    restart: unless-stopped
    ports: ["127.0.0.1:7862:7862"]
    volumes: ["./data/output:/app/output"]
    environment: [NVIDIA_VISIBLE_DEVICES=0]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['0'], capabilities: [gpu]}]
    networks: [scarlix-net]
    profiles: [creative]
networks:
  scarlix-net: {external: true}
