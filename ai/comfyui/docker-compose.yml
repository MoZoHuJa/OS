services:
  comfyui:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
    # v18.7.7 P1: GHCR (ghcr.io) requires auth to query tags via API — can't
    #   auto-verify in CI. Before the v18.7.7 release goes out, manually check
    #   https://github.com/ai-dock/comfyui/pkgs/container/comfyui for version
    #   tags, then replace `:latest` below with the verified `:vX.Y.Z` tag.
    # v18.7.8 P0: Pinned to verified versioned tag (was: :latest → supply-chain
    #   risk: git commit + identical install.sh + install today → image A, but
    #   next week → image B without any change in SCARLIX OS). Verified via
    #   ghcr.io/v2/ai-dock/comfyui/tags/list — latest versioned cuda-12.1.1-base
    #   tag is v0.2.7. Update deliberately when upgrading, don't let it float.
    image: ghcr.io/ai-dock/comfyui:v2-cuda-12.1.1-base-22.04-v0.2.7
    container_name: comfyui
    restart: unless-stopped
    ports: ["127.0.0.1:8188:8188"]
    volumes:
      - /var/lib/scarlix/comfyui/models:/ComfyUI/models
      - /var/lib/scarlix/comfyui/output:/ComfyUI/output
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
      - NVIDIA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['0'], capabilities: [gpu]}]
    networks: [scarlix-net]
    profiles: [creative]
networks:
  scarlix-net: {external: true}
