services:
  needle-router:
    # v18.8 P1: Supply-chain risk — NOT YET PINNED (was: :latest → git commit +
    #   identical install → image A, next week → image B without any SCARLIX
    #   change). GHCR anonymous token returns NO_ACCESS for cactus-compute/needle
    #   → can't auto-verify tags. Before FINAL release, manually check
    #   https://github.com/cactus-compute/needle/pkgs/container/needle for version
    #   tags, then replace :latest with the verified :vX.Y.Z tag.
    image: ghcr.io/cactus-compute/needle:latest
    container_name: needle-router
    restart: unless-stopped
    ports: ["127.0.0.1:11441:11440"]
    volumes:
      - ./data:/root/.needle
      - /models:/models:ro
    environment:
      - NEEDLE_MODEL_PATH=/models/needle-router-v1
      - NEEDLE_BACKENDS=sglang:30000,ollama-agent:11435,beellama:8080
      - NEEDLE_ROUTING_STRATEGY=latency-aware
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['1'], capabilities: [gpu]}]
    networks: [scarlix-net]
networks:
  scarlix-net: {external: true}
