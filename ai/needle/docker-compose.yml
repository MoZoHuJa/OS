# SCARLIX OS v18.8.2 — Needle Router (EXPERIMENTAL, latency-aware intent router)
# v18.8.2 P1 (B-a/c): Marked experimental profile (was: :latest in default stack
#   → non-reproducible + runs by default. Now: profiles: [experimental] — won't
#   start with default `compose up`, only with `--profile experimental`. Image
#   stays :latest because GHCR API returns NO_ACCESS for cactus-compute/needle.)
services:
  needle-router:
    # v18.8.2 P1: :latest — could NOT pin (GHCR API NO_ACCESS).
    #   Isolated to experimental profile to prevent production use.
    image: ghcr.io/cactus-compute/needle:latest
    container_name: needle-router
    restart: unless-stopped
    # v18.8.2 P1: experimental profile — does NOT start in default compose up
    profiles: ["experimental"]
    ports: ["127.0.0.1:11441:11440"]
    volumes:
      - ./data:/root/.needle
      - /models:/models:ro
    environment:
      - NEEDLE_MODEL_PATH=/models/needle-router-v1
      - NEEDLE_BACKENDS=sglang:30000,ollama-agent:11435,beellama:8080
      - NEEDLE_ROUTING_STRATEGY=latency-aware
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['1'], capabilities: [gpu]}]
    networks: [scarlix-net]
networks:
  scarlix-net: {external: true}
