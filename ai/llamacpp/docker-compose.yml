# SCARLIX OS v17.5.1 — BeeLlama.cpp / llama.cpp (Tier-4, CPU offline fallback)
# v17.5.1 FIX: Uses CPU image (server, not server-cuda) for true CPU offline fallback.
#   server-cuda requires NVIDIA runtime which may not be available in offline mode.
# Model path from env var ${LLAMACPP_MODEL_PATH}

services:
  beellama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: beellama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11438:8080"
    volumes:
      - /models:/models:ro
    command: >
      --model ${LLAMACPP_MODEL_PATH:-/models/qwen3.6-14b-instruct-q4_k_m.gguf}
      --ctx-size 32768
      --threads 16
      --host 0.0.0.0
      --port 8080
      --cache-type-k q4_0
      --cache-type-v q4_0
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
