# SCARLIX OS v17.1 — BeeLlama.cpp (Tier-4 inference — replaces llama.cpp)
# FIX I2: Drop-in upgrade — KVarN (variance-normalized KV-cache quantization)
# ~50% VRAM reduction at near-equal quality → doubles context length on 16GB GPU
# Reasoning-loop protection for unattended long agent runs
#
# MIT | https://github.com/Anbeeld/beellama.cpp
# Same CLI/API as llama.cpp — existing scripts work unchanged

services:
  beellama:
    image: ghcr.io/anbeeld/beellama:server-cuda-latest
    container_name: beellama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11438:8080"
    volumes:
      - /models:/models:ro
    command: >
      --model /models/qwen3.6-14b-instruct-q4_k_m.gguf
      --ctx-size 32768
      --threads 16
      --host 0.0.0.0
      --port 8080
      --cache-type-k kvarn4
      --cache-type-v kvarn4
      --kv-tail-tokens 1024
      --reasoning-loop-protection
    networks: [scarlix_ai]
networks:
  scarlix_ai: { external: true }
