# SCARLIX OS v18.5.2 — BeeLlama.cpp / llama.cpp (Tier-4, CPU offline fallback)
# v17.5.1 FIX: Uses CPU image (server, not server-cuda) for true CPU offline fallback.
#   server-cuda requires NVIDIA runtime which may not be available in offline mode.
# Model path from env var ${LLAMACPP_MODEL_PATH}

services:
  beellama:
    # v18.8.2 P1: Pinned by digest (was: :server — floating tag, BeeLlama is
    #   CPU offline fallback so reproducibility matters. llama.cpp publishes no
    #   version tags, only `server` (latest) + variant tags (server-cuda etc).
    #   Digest verified via ghcr.io/v2/ggml-org/llama.cpp/manifests/server.
    #   Update deliberately when upgrading — re-pull latest digest.)
    image: ghcr.io/ggml-org/llama.cpp@sha256:6d607629e3dd5e85f45c43d1494648126cb3f93f2122c9cd53f43242c94cde14
    container_name: beellama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11438:8080"
    volumes:
      - /models:/models:ro
    command: >
      --model ${LLAMACPP_MODEL_PATH:-/models/Qwen3-14B-Q4_K_M.gguf}
      --ctx-size 32768
      --threads 16
      --host 0.0.0.0
      --port 8080
      --cache-type-k q4_0
      --cache-type-v q4_0
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  scarlix-net: { external: true }
