services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "127.0.0.1:11438:8080"
    volumes:
      - /models:/models:ro
    command: >
      --model /models/qwen3.6-14b-instruct-q4_k_m.gguf
      --ctx-size 8192
      --threads 16
      --host 0.0.0.0
      --port 8080
    networks: [scarlix_ai]
networks:
  scarlix_ai: { external: true }
