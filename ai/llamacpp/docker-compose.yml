# SCARLIX OS v17.4 — BeeLlama.cpp / llama.cpp (Tier-4, CPU offline fallback)
# v17.4: Use official llama.cpp image (BeeLlama fork image was unverified).
#   KVarN flags are BeeLlama-specific — kept as comments for when BeeLlama matures.
#   Official llama.cpp supports --cache-type-k q4_0 (4-bit KV cache, similar benefit).

services:
  beellama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: beellama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11438:8080"
    volumes:
      - /models:/models:ro
    command: >
      --model /models/qwen3.6-14b-instruct-q4_k_m.gguf
      --ctx-size 32768
      --threads 16
      --host 0.0.0.0
      --port 8080
      --cache-type-k q4_0
      --cache-type-v q4_0
    # BeeLlama.cpp KVarN flags (uncomment when BeeLlama image is stable):
    #   --cache-type-k kvarn4
    #   --cache-type-v kvarn4
    #   --kv-tail-tokens 1024
    #   --reasoning-loop-protection
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
