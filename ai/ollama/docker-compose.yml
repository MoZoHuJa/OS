# SCARLIX OS v17.5.1 — Ollama (fallback, GPU 0)
# v17.5.1 FIXES:
#   - Volume: absolute path /var/lib/scarlix/ollama (was ./data — relative, lost on cwd change)
#   - GPU: device_ids ['0'] (was ['1'] — conflicted with vLLM on GPU1)
#   - Healthcheck: uses wget (curl may not be in image)
services:
  ollama-agent:
    image: ollama/ollama:0.5.4
    container_name: ollama-agent
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - /var/lib/scarlix/ollama:/root/.ollama
      - /models:/models:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - TZ=Europe/Bratislava
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  scarlix-net: { external: true }
