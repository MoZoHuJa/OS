# SCARLIX OS v18.5.2 — Ollama (CPU fallback, not GPU, mem_limit 6g)
# v17.7: mem_limit 6g (was unlimited — OOM risk), CPU only, root:root volume
services:
  ollama-agent:
    # v19.4.2 P1: 0.5.4 (2024-12) → 0.40.7 (2026-10-21, latest) — ~2-year gap
    #   on a default-on CPU inference fallback. No state migrations: models live
    #   in /var/lib/scarlix/ollama (volume, untouched); REST API is backward
    #   compatible. Digest pinned for immutability. After upgrade: healthcheck
    #   (`ollama list`) + one CPU inference test; watch RSS — newer releases
    #   may need more than the 6g mem_limit. Rollback = re-pin 0.5.4 (cached).
    image: ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    container_name: ollama-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - /var/lib/scarlix/ollama:/root/.ollama
      - /models:/models:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # v18.8.8 P2-01: Ollama config from models.yaml → .env (was: hardcoded
      #   OLLAMA_NUM_PARALLEL=2 + OLLAMA_KEEP_ALIVE=-1 which contradicted
      #   models.yaml keep_alive=15m. Now: env vars from scarlix-mode generate_env_file.)
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-15m}
      - OLLAMA_FLASH_ATTENTION=0
      - TZ=Europe/Bratislava
    mem_limit: 6g
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  scarlix-net: { external: true }
