# SCARLIX OS v17.6 — Ollama (CPU fallback, not GPU)
# v17.6 FIX: Ollama runs on CPU (was GPU0 — if GPU0 driver dies, fallback still works)
# No deploy.resources.devices section = CPU only
services:
  ollama-agent:
    image: ollama/ollama:0.5.4
    container_name: ollama-agent
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - /var/lib/scarlix/ollama:/root/.ollama
      - /models:/models:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=0
      - TZ=Europe/Bratislava
    # v17.6: No GPU allocation — CPU only fallback (survives GPU0 driver failure)
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  scarlix-net: { external: true }
