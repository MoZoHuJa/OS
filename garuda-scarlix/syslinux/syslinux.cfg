DEFAULT scarlix
PROMPT 0
TIMEOUT 30

LABEL scarlix
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
  # FIX 3-a: console=ttyS0 forces archiso kernel to output to serial port
  # so QEMU -serial capture is deterministic.
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% scarlix_boot=1 console=tty0 console=ttyS0,115200n8
