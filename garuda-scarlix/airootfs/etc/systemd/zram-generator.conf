# SCARLIX OS v16.5 — ZRAM Generator Configuration
# FIX 9-a: zstd compression + 32GB allocation via zram-generator
#
# This file is read by systemd-zram-setup@.service (from zram-generator package).
# It creates a /dev/zram0 block device formatted as swap on boot.
#
# Rationale: 32GB ZRAM gives the system a fast swap tier that compresses
# cold memory pages with zstd (≈3-4x ratio), effectively extending usable
# RAM by ~3x without disk I/O. Critical for running 3 inference tiers +
# Docker + gaming concurrently.
#
# Placement: /etc/systemd/zram-generator.conf (read by zram-generator on boot)
# Installed in ISO via garuda-scarlix/airootfs overlay.

[zram0]
# Compress with zstd (best ratio vs CPU — typical 3.5x on mixed workload)
compression-algorithm = zstd

# 32GB virtual swap (compressed to ~9GB real RAM usage at 3.5x ratio)
# On systems with less RAM, zram-generator caps at zram-size = ram-size,
# so this is a safe upper bound.
zram-size = 32768

# Standard swap priority
swap-priority = 100

# Optional: mount as /var/tmp (we keep swap-only — simpler, fewer surprises)
fs-type = swap
