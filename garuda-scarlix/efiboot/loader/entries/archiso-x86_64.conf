title   SCARLIX OS v16.5 (Garuda)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
# FIX 3-a: console=ttyS0 forces archiso kernel to output to serial port
# so QEMU -serial capture is deterministic (not dependent on archiso defaults).
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% scarlix_boot=1 console=tty0 console=ttyS0,115200n8
