# SCARLIX OS v19.6.7 — image-pin allowlist (the SK-audit P2-03 registry)
#
# POLICY: an experimental image may ride :latest ONLY with a documented
# reason AND a review-by date (YYYY-MM-DD). While today <= review-by the
# weekly stale-tree audit reports the image as UNPINNED-ALLOWED (an INFO
# line — visible debt, NOT a finding, no exit-code effect). The day after,
# the entry EXPIRES and the image reverts to a normal UNPINNED finding that
# names the expiry — the default is debt, exceptions are borrowed. Digest
# pinning needs network pulls the offline audit cannot do; pin-a-digest or
# archive the stack is the REAL fix — this file is the named, time-bounded
# exception registry, edited as deliberately as the classification registry
# inside the audit script (few entries, dated, reviewed — an evergreen
# allowlist is a policy hole).
#
# Entries: image|reason|review-by   ('#' comments and blank lines ignored)
#
# An explicit override path for this file: SCARLIX_STALE_AUDIT_PIN_ALLOWLIST
# (a missing override is named on stderr and audited as if no allowlist
# existed — never silently ignored).

