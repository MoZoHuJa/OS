services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [scarlix-net]

  gitea:
    # v19.4.2 P1: 1.23 → 28.2 (upstream dropped the "1." prefix after 1.27 —
    #   28.x is the direct successor line). Direct upgrade is supported by
    #   upstream (chained, transactional DB migrations run on container start);
    #   changelog audit 1.24→28.2 (2026-10-21) found no breaking changes that
    #   affect this compose (GITEA__database__* env, USER_UID/GID, /data volume).
    #   Before upgrading on the host: `docker exec gitea gitea dump` + pg_dump;
    #   verify web UI + git push/pull after start. Rollback = restore dump +
    #   re-pin 1.23 (image stays in local cache). Cautious alternative (audit §4):
    #   walk 1.24→…→28.2 locally first. Floating minor tag (28.2.x patches flow).
    image: gitea/gitea:28.2
    container_name: gitea
    restart: unless-stopped
    ports:
      - "100.64.0.2:3000:3000"
    volumes:
      - ./gitea/data:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [scarlix-net]

  coolify:
    # v19.4.2 P0: 4.0.30 tag was pruned upstream (registry 404 → pull fail on
    #   clean deploy). Rung 1/2 of the audit ladder (§3): 4.0.30 → 4.3.1 → 4.4.0.
    #   4.3.1 is a bugfix-only release (changelog verified 2026-10-21). Docker
    #   Hub prunes old coolify tags aggressively — digest pinned for immutability.
    #   Privileged context (docker.sock:ro): back up ./coolify/data + pg_dump
    #   before `docker compose pull`; verify UI + managed apps after upgrade;
    #   rollback = restore backup + re-pin (old image in local cache).
    image: coollabsio/coolify:4.3.1@sha256:c054910edd0b4f56de17bacfbe2a501e06ccdfdb4df2e284ca09d49916c7cf32
    container_name: coolify
    restart: unless-stopped
    ports:
      - "100.64.0.2:8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./coolify/data:/data
    environment:
      - APP_ID=scarlix-coolify
      - APP_KEY=${COOLIFY_APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=coolify
      - DB_USERNAME=coolify
      - DB_PASSWORD=${COOLIFY_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [scarlix-net]

  nextcloud:
    # v19.4.2 P1: 29 → 30 — rung 1/6 of the mandatory Nextcloud ladder (audit
    #   §4: +1 major per step, `occ upgrade` at each step; a direct 29→35 jump
    #   is NOT supported). Remaining rungs: 30→31→…→35, one per ScarLiX
    #   release. Floating major tag on purpose (30.0.x security patches flow).
    #   Full backup (data + config + pg_dump) before upgrade; after start watch
    #   `docker compose logs -f nextcloud` for the 29→30 migration, then
    #   `occ app:update --all`. Rollback = restore backup + re-pin 29 (cached).
    image: nextcloud:30
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "100.64.0.2:8080:80"
    volumes:
      - ./nextcloud/data:/var/www/html/data
      - ./nextcloud/config:/var/www/html/config
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - TRUSTED_DOMAINS=files.scarlix.example.com
      - OVERWRITEPROTOCOL=https
    depends_on:
      postgres: { condition: service_healthy }
    networks: [scarlix-net]

  photoprism:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
        # v18.8.1 P1: Pinned to date-based tag (was: :latest — non-reproducible.
    #   PhotoPrism uses date tags YYYYMMDD, no semver. Verified via Docker Hub API.
    #   Update deliberately when upgrading.)
    image: photoprism/photoprism:260919
    container_name: photoprism
    restart: unless-stopped
    ports:
      - "100.64.0.2:2342:2342"
    volumes:
      - ./photoprism/storage:/photoprism/storage
      - /mnt/photos:/photoprism/originals:ro
    environment:
      - PHOTOPRISM_ADMIN_PASSWORD=${PHOTOPRISM_ADMIN_PASSWORD}
      - PHOTOPRISM_DATABASE_DRIVER=sqlite
      - PHOTOPRISM_HTTP_HOST=0.0.0.0
      - PHOTOPRISM_HTTP_PORT=2342
    networks: [scarlix-net]

  n8n:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
        # v18.8.1 P1: Pinned to stable version (was: :latest — non-reproducible.
    #   Verified via Docker Hub API — latest stable is 2.42.1.)
    image: n8nio/n8n:2.42.1
    container_name: n8n
    restart: unless-stopped
    ports:
      - "100.64.0.2:5678:5678"
    volumes:
      - ./n8n/data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
