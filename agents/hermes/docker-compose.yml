services:
  hermes:
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → supply-chain risk)
    # v18.7.6 P2 TODO: Pin to specific version (was: :latest → supply-chain risk).
    #   Could not verify the exact published tag for nousresearch/hermes-agent
    #   from within the build sandbox (no registry access). Keeping :latest so
    #   `docker compose up -d` does not break on missing-tag — coordinator MUST
    #   verify against https://hub.docker.com/r/nousresearch/hermes-agent/tags
    #   before the v18.7.6 release goes out, then replace `:latest` below with
    #   the verified `:vX.Y.Z` tag (and remove this TODO block).
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:7999:7999"
    volumes:
      - ./config:/root/.hermes
      - ./workspace:/workspace
      - /opt/scarlix:/opt/scarlix:ro
    environment:
      - HERMES_HOME=/root/.hermes
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_ZMOR_CHAT_ID}
      - TZ=Europe/Bratislava
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  scarlix-net: { external: true }
