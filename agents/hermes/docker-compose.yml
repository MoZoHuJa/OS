services:
  hermes:
    # v18.7.7 P1: Pinned to verified versioned tag (was: :latest → supply-chain
    #   risk: git commit + identical install.sh + install today → image A, but
    #   next week → image B without any change in SCARLIX OS). Verified via
    #   hub.docker.com/v2/repositories/nousresearch/hermes-agent/tags — latest
    #   non-desktop version tag is v2026.9.24. Update deliberately when upgrading.
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:7999:7999"
    volumes:
      - ./config:/root/.hermes
      - ./workspace:/workspace
      - /opt/scarlix:/opt/scarlix:ro
    environment:
      - HERMES_HOME=/root/.hermes
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_ZMOR_CHAT_ID}
      - TZ=Europe/Bratislava
    networks: [scarlix-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  scarlix-net: { external: true }
