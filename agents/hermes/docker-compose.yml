services:
  hermes:
    # ── Hermes Agent v0.22.2 (Task 12 migration; full report: UPGRADE_REPORT.md) ──
    #
    # Image pin: verified against Docker Hub (hub.docker.com/v2/.../tags) and the
    # registry manifest API on 2026-10-21:
    #   - tag v0.22.2 → manifest-list digest sha256:36099926da31... (linux/amd64 +
    #     linux/arm64; amd64 image sha256:a11574b7fe8e..., pushed 2026-10-15)
    #   - the upstream `stable` tag points at the SAME digest (release-gate image)
    #   - v0.22.3 exists only as rc.1/rc.2 → v0.22.2 is the newest stable release
    #   - old pin was v2026.9.24 (= upstream v0.21.5, digest sha256:fca358f12efd...)
    # Never use `latest` as a production dependency (v18.7.7 P1 precedent).
    image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
    container_name: hermes
    restart: unless-stopped
    # v0.22.2 runtime is s6-overlay: PID 1 is `/init` via the image ENTRYPOINT
    # (entrypoint-dispatch.sh). DO NOT override entrypoint — bypassing /init skips
    # the UID remap, chown and config seeding, and the gateway breaks.
    # `gateway run` is the documented way to run a persistent messaging gateway
    # (Telegram/Discord/...). It is supervised by s6: a crashing gateway process
    # is restarted without losing the container.
    command: ["gateway", "run"]
    volumes:
      # v0.22.2: user data home is /opt/data (upstream default HERMES_HOME). The
      # old /root/.hermes mount is gone; migrate existing data with
      # ./migrate-to-v0.22.2.sh --apply (it backs up ./config first).
      - ./config:/opt/data
      - ./workspace:/workspace
      # ScarLiXOS system files stay read-only (verified by UPGRADE_REPORT tests).
      - /opt/scarlix:/opt/scarlix:ro
    environment:
      # UID/GID remap: stage2-hook remaps the internal `hermes` user to these
      # values and chowns the hermes-owned subtrees of /opt/data. Set them in
      # .env to the host user that owns ./config (must be 1–65534, non-root).
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # LiteLLM via scarlix-net. v0.22.2 renamed the env var:
      # OPENAI_API_BASE (gone) → OPENAI_BASE_URL.
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Telegram gateway: enabled by the token; the allowlist is TELEGRAM_ALLOWED_USERS
      # (comma-separated Telegram USER IDs; v0.22.2 no longer reads TELEGRAM_CHAT_ID).
      # For private chats the chat id equals the peer user id, so the existing
      # TELEGRAM_ZMOR_CHAT_ID value keeps working as the allowlist entry.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ZMOR_CHAT_ID}
      # API server (OpenAI-compatible, serves GET /health). v0.22.2 gates it on
      # API_SERVER_ENABLED + API_SERVER_KEY. Bound to container loopback only —
      # the port is NOT published to the host; the Docker healthcheck uses it.
      # To expose it later, follow UPGRADE_REPORT.md §6 (never without a key).
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=127.0.0.1
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
      - TZ=Europe/Bratislava
    networks: [scarlix-net]
    healthcheck:
      # v0.22.2: port 7999 no longer exists upstream; the health endpoint moved
      # to the API server on 8642 (GET /health, no auth, returns JSON status).
      # curl ships in the image (Dockerfile runtime deps). start_period covers
      # the s6 supervision tree + gateway connect on the 1.1 GB image.
      test: ["CMD", "curl", "-sf", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
networks:
  scarlix-net: { external: true }
