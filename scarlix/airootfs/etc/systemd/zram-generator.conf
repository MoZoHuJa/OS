# SCARLIX OS v17.0 — EndeavourOS Edition — ZRAM Generator Configuration
# zstd compression + 32GB allocation (caps at RAM size on smaller systems)
#
# v17.0: uses min(ram, 32768) per migration guide recommendation
# (v16.5 used a fixed 32768 — works but min(ram, 32768) is more correct)
#
# Placement: /etc/systemd/zram-generator.conf (read by zram-generator on boot)

[zram0]
# zstd: best ratio vs CPU (typical 3.5x on mixed AI+Docker+gaming workload)
compression-algorithm = zstd

# 32GB virtual swap OR system RAM — whichever is smaller
# (prevents over-allocation on low-RAM hosts)
zram-size = min(ram, 32768)

# Standard swap priority
swap-priority = 100

# Swap-only (simpler than mounting as /var/tmp)
fs-type = swap
