# SCARLIX OS v17.1 — ZRAM Generator Configuration
# FIX Q9a: min(ram/2, 16384) — ArchWiki recommendation
#
# v17.1: Changed from min(ram, 32768) → min(ram/2, 16384)
#   16GB RAM → 8GB ZRAM (safe), 32GB → 16GB (optimal), 64GB → 16GB (capped)

[zram0]
compression-algorithm = zstd
zram-size = min(ram / 2, 16384)
swap-priority = 100
fs-type = swap
