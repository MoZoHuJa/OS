# SCARLIX OS v17.2 — Calamares mount.conf
# FIX Q2b: Minimal — only @ and @home (Calamares default-safe)
#
# v17.2 CORRECTION (vs v17.1):
#   - v17.1 had 8 subvols in mount.conf → Calamares crashed on existing subvols
#   - v17.2: only @ and @home here (safe defaults)
#   - Specialized subvols (@models, @var_lib_docker, @root, @srv, @var_log, @snapshots)
#     created by first-boot.sh Phase 1 as EMPTY dirs → chattr +C works
#
# This avoids:
#   1. "btrfs subvolume create returned non-zero" on disks with existing subvols
#   2. chattr +C failing on non-empty dirs (Calamares had written data)

---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: bind
  - device: /run
    mountPoint: /run
    options: bind

btrfsSubvolumes:
  - subvolume: /@
    mountPoint: /
  - subvolume: /@home
    mountPoint: /home
