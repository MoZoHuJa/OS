# SCARLIX OS v17.1 — Calamares mount.conf
# FIX Q3b: Explicit BTRFS subvolume layout in Calamares (not first-boot.sh)
#
# This configures Calamares to create the SCARLIX BTRFS subvolume layout
# during installation, replacing the v17.0 approach of creating them in
# first-boot.sh (which was too late — Calamares already created its own).
#
# Subvolumes created at install time:
#   @                → /          (root)
#   @home            → /home
#   @root            → /root
#   @srv             → /srv
#   @var_log         → /var/log
#   @var_lib_docker  → /var/lib/docker  (CoW disabled post-mount)
#   @models          → /models          (CoW disabled post-mount)
#   @snapshots       → /.snapshots      (Snapper root config)

---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: bind
  - device: /run
    mountPoint: /run
    options: bind

btrfsSubvolumes:
  - subvolume: /@
    mountPoint: /
  - subvolume: /@home
    mountPoint: /home
  - subvolume: /@root
    mountPoint: /root
  - subvolume: /@srv
    mountPoint: /srv
  - subvolume: /@var_log
    mountPoint: /var/log
  - subvolume: /@var_lib_docker
    mountPoint: /var/lib/docker
  - subvolume: /@models
    mountPoint: /models
  - subvolume: /@snapshots
    mountPoint: /.snapshots
