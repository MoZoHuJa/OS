# SCARLIX OS v17.1 — Calamares partition.conf
# Default filesystem: BTRFS (for Snapper snapshots + CoW control)

---
defaultFileSystemType: "btrfs"
availableFileSystems: ["btrfs", "ext4", "xfs"]

# Enable LUKS encryption option
enableLuksAutomatedPartitioning: true

# Partition layout suggestions
partitionLayout:
  - name: "EFI"
    filesystem: "fat32"
    mountPoint: "/boot/efi"
    size: 512MiB
    flags: [boot, esp]
  - name: "root"
    filesystem: "btrfs"
    mountPoint: "/"
    size: 100%
