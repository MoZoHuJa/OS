# SCARLIX OS v17.4 — pacman.conf for archiso profile
# EndeavourOS Edition — standard Arch repos only
# v17.4: Removed [docker] repo (doesn't exist on Arch — was breaking pacman -Syu)
#   nvidia-container-toolkit installed via yay (AUR) in install.sh

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
RemoteFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
