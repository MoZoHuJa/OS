# SCARLIX OS v17.0 — pacman.conf for archiso profile
# EndeavourOS Edition — uses standard Arch repos only (no Garuda repo)
#
# v17.0: removed [garuda] repo section (was in v16.x)

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
RemoteFileSigLevel = Optional

# Standard Arch repositories — sufficient for all SCARLIX packages
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
