# SCARLIX OS v17.2 — pacman.conf for archiso profile
# EndeavourOS Edition — standard Arch repos + Docker official repo
#
# v17.2: Added [docker] repo for nvidia-container-toolkit (was AUR in v17.1)

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
RemoteFileSigLevel = Optional

# Standard Arch repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Docker official repo — for nvidia-container-toolkit (avoids AUR dependency)
[docker]
SigLevel = Optional TrustAll
Server = https://download.docker.com/linux/arch/$arch
