title   SCARLIX OS v17.0 (EndeavourOS)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
# console=ttyS0 forces archiso kernel to output to serial port → deterministic
# QEMU -serial capture (kept from v16.5 P0-3 fix).
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% scarlix_boot=1 console=tty0 console=ttyS0,115200n8
