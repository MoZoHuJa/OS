# SCARLIX OS v17.9.8 — ScarliHQ Dashboard compose (host-bridge architecture)
# v17.9.8 ARCHITECTURE: ScarliHQ has NO privileged host access.
#   - Reads /var/lib/scarlix/host-status.json (written by scarlix-host-bridge timer on host)
#   - Reads /var/lib/scarlix/current-mode (written by scarlix-mode on host)
#   - Writes /var/lib/scarlix/desired-mode (read by scarlix-host-bridge timer)
#   - Reads /etc/scarlix/{models.yaml,profiles/,VERSION}
#
# v17.9.8 FIXES:
#   P0: Removed /var/run/docker.sock mount (was privilege escalation — :ro doesn't make daemon read-only)
#   P0: Removed scarlix-mode mount (was: needed yq/sudo/systemctl in container — all missing)
#   P0: Removed nvidia runtime (was: deploy.resources ignored by non-swarm compose anyway)
#   P1: Auth token from /etc/scarlix/.env (SCARLIHQ_TOKEN) — all /api/* and /ws require it
services:
  scarlihq:
    build: .
    image: scarlihq:latest
    container_name: scarlihq
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # READ-ONLY: host status (written by scarlix-host-bridge.timer every 5s)
      - /var/lib/scarlix:/var/lib/scarlix:ro
      # WRITABLE: bridge-input subdir (overrides ro parent for this path only)
      # v18.0.0 P0: ScarliHQ writes ONLY desired-mode here. State (.retry, last-transition)
      # is in bridge-state/ (root:root 700 — NOT mounted writable to ScarliHQ).
      # Was (v17.9.9): single bridge/ dir = symlink attack surface.
      - /var/lib/scarlix/bridge-input:/var/lib/scarlix/bridge-input:rw
      # READ-ONLY: scarlix config + profiles + VERSION
      - /etc/scarlix:/etc/scarlix:ro
    environment:
      - SCARLIHQ_PORT=8090
      - SCARLIHQ_TOKEN=${SCARLIHQ_TOKEN}
      - TZ=Europe/Bratislava
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
