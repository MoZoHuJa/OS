# SCARLIX OS v18.5.2 — ScarliHQ Dashboard compose (host-bridge architecture)
# v17.9.8 ARCHITECTURE: ScarliHQ has NO privileged host access.
#   - Reads /var/lib/scarlix/host-status.json (written by scarlix-host-bridge timer on host)
#   - Reads /var/lib/scarlix/current-mode (written by scarlix-mode on host)
#   - Writes /var/lib/scarlix/desired-mode (read by scarlix-host-bridge timer)
#   - Reads /etc/scarlix/{models.yaml,profiles/,VERSION}
#
# v17.9.8 FIXES:
#   P0: Removed docker daemon socket mount (was privilege escalation)
#   P0: Removed scarlix-mode mount (was: needed yq/sudo/systemctl in container — all missing)
#   P0: Removed nvidia runtime (was: deploy.resources ignored by non-swarm compose anyway)
#   P1: Auth token from /etc/scarlix/.env (SCARLIHQ_TOKEN) — all /api/* and /ws require it
services:
  scarlihq:
    build: .
    # v18.7.4 P2 TODO: Pin to specific version tag (was: :latest → locally-built, no supply-chain risk but reproducibility concern)
    # v18.7.6 P2: Pinned to versioned image for reproducibility (was: scarlihq:latest).
    #   install.sh now builds scarlihq:v$VERSION — same source as :latest was, but the
    #   explicit tag means a re-pull from a registry (or a future migrate-to-registry
    #   step) gets a deterministic image, not whatever :latest currently points to.
    # v18.8.2 P0: Use ${SCARLIX_VERSION} from /etc/scarlix/.env (was: hardcoded tag
    #   like v18.8.1 — sed regex bumps created v18.8.1.1 mismatch → compose couldn't
    #   find the image install.sh built. Now: single source of truth from VERSION
    #   file via generate-env.sh, compose interpolates ${SCARLIX_VERSION}.)
    image: scarlihq:v${SCARLIX_VERSION}
    container_name: scarlihq
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      # READ-ONLY: host status (written by scarlix-host-bridge.timer every 5s)
      - /var/lib/scarlix:/var/lib/scarlix:ro
      # WRITABLE: bridge-input subdir (overrides ro parent for this path only)
      # v18.0.0 P0: ScarliHQ writes ONLY desired-mode here. State (.retry, last-transition)
      # is in bridge-state/ (root:root 700 — NOT mounted writable to ScarliHQ).
      # Was (v17.9.9): single bridge/ dir = symlink attack surface.
      - /var/lib/scarlix/bridge-input:/var/lib/scarlix/bridge-input:rw
      # READ-ONLY: scarlix config + profiles + VERSION
      - /etc/scarlix:/etc/scarlix:ro
    environment:
      - SCARLIHQ_PORT=8090
      - SCARLIHQ_TOKEN=${SCARLIHQ_TOKEN}
      - TZ=Europe/Bratislava
      # v19.3.2 — OPT-IN compute lifecycle (F-04 closure). Uncomment BOTH the
      # two volumes below AND these env vars to enable /api/compute/start|stop.
      # Prerequisites (in order):
      #   1. scarlix-workload-bridge.service enabled + configured
      #      (docs/SCARLIX_COMPUTE_FABRIC_P6_SCARLIHQ_INTEGRATION.md)
      #   2. scarlix-reservation.service enabled + /etc/scarlix/reservation.json
      #      installed (docs/SCARLIX_COMPUTE_FABRIC_RESERVATION_GOVERNOR.md)
      #   3. host acceptance signed off for this release.
      # Caveat: the bridge socket is bind-mounted as a file — if the bridge
      # service restarts, restart this container too (stale socket mount).
      #   - SCARLIHQ_COMPUTE_ENABLED=true
      #   - SCARLIHQ_COMPUTE_SOCKET=/run/scarlix-workload-bridge/bridge.sock
      #   - SCARLIHQ_ALLOCATION_STORE=/var/lib/scarlix-reservation/allocations.jsonl
      #   - SCARLIHQ_COMPUTE_PRINCIPAL=scarlihq.compute
      # v19.4.1 — OPT-IN Agent Kernel session API (AK-2). Uncomment to enable
      # /api/agent/sessions (create/list/transition/evaluate). Sessions are
      # in-memory + bounded (128); grants are request-supplied until AK-3
      # persists them admin-owned. No mounts needed — evaluate is pure.
      #   - SCARLIHQ_AGENTKERNEL_ENABLED=true
      # v19.4.4 — OPT-IN Agent Kernel grant registry (AK-3). Uncomment BOTH
      # vars to make grants persisted, admin-owned acts bound to the
      # reservation governor's user_tokens principal space. Requires the
      # mount below (see v19.4.4 note at the bottom of this file).
      #   - SCARLIHQ_AGENT_GRANTS_FILE=/var/lib/scarlix-agentkernel/grants.json
      #   - SCARLIHQ_AGENT_PRINCIPALS=zmor,scarlihq.compute
    # v19.3.2 — OPT-IN compute lifecycle mounts (see env notes above).
    #   - /var/lib/scarlix-reservation:/var/lib/scarlix-reservation:rw
    #   - /run/scarlix-workload-bridge/bridge.sock:/run/scarlix-workload-bridge/bridge.sock
    # v19.4.4 — OPT-IN Agent Kernel grant registry mount (AK-3; pair with
    # SCARLIHQ_AGENT_GRANTS_FILE above). The directory must exist host-side
    # with mode 0700 (the registry fail-closes on looser permissions —
    # tamper discipline, not a convenience default).
    #   - /var/lib/scarlix-agentkernel:/var/lib/scarlix-agentkernel:rw
    networks: [scarlix-net]
networks:
  scarlix-net: { external: true }
